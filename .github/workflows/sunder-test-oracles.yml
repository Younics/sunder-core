name: Sunder Test Oracles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: sunder-test-oracles-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.100"
  NODE_VERSION: "24.18.1"
  NPM_VERSION: "11.19.0"
  SUNDER_REQUIRE_APP_WEB_BRIDGE_VM: "1"

jobs:
  complete-result-contract:
    name: Complete TRX and JUnit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json

      - name: Install exact npm and dependencies
        run: |
          npm install --global "npm@${NPM_VERSION}" --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
          npm ci --prefix languages/typescript/node

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build Core
        run: |
          dotnet restore Sunder.Core.slnx --locked-mode
          dotnet build Sunder.Core.slnx --configuration Release --no-restore -m:1 -p:GeneratePackageOnBuild=false

      - name: Verify compact lane and skip policy
        run: node scripts/test-oracles/check-core-test-policy.mjs

      - name: Emit every .NET TRX
        if: always()
        run: node scripts/test-oracles/run-dotnet-tests-with-results.mjs --configuration Release

      - name: Emit every Node JUnit through the dual reporter
        if: always()
        run: node scripts/test-oracles/run-node-test-matrix-with-results.mjs

      - name: Emit Python and shell fixture JUnit
        if: always()
        run: node scripts/test-oracles/run-release-fixtures-with-results.mjs

      - name: Generate strict compact test evidence
        if: always()
        run: node scripts/test-oracles/summarize-core-test-results.mjs

      - name: Upload complete result contract
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-core-test-results
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14

  required-output-lock-selection:
    name: Required output-lock selection cannot skip
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUNDER_REQUIRE_NODE_OUTPUT_LOCK_INTEROP: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build exact Node lock helper
        run: |
          npm install --global "npm@${NPM_VERSION}" --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
          npm ci --prefix languages/typescript/node
          npm exec --prefix languages/typescript/node -- tsc -p packages/package-tool/tsconfig.test.json

      - name: Gate exact external selection
        run: >-
          node scripts/test-oracles/run-core-test-lane.mjs
          --test Sunder.Package.Build.Tests.PackageBuildManifestTests.SharedOutputLock_InteroperatesWithNodeProducerWhenAvailable

      - name: Execute exact external selection with TRX
        run: |
          dotnet restore languages/csharp/dotnet/tests/Sunder.Package.Build.Tests/Sunder.Package.Build.Tests.csproj --locked-mode
          dotnet test languages/csharp/dotnet/tests/Sunder.Package.Build.Tests/Sunder.Package.Build.Tests.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            --filter FullyQualifiedName~SharedOutputLock_InteroperatesWithNodeProducerWhenAvailable \
            --logger "trx;LogFileName=Sunder.Package.Build.Tests.trx" \
            --results-directory artifacts/selected-output-lock/dotnet

      - name: Reject a post-READY skip
        if: always()
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs artifacts/selected-output-lock
          --allow-partial
          --require-test Sunder.Package.Build.Tests.PackageBuildManifestTests.SharedOutputLock_InteroperatesWithNodeProducerWhenAvailable

      - name: Upload selected output-lock result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-oracle-output-lock-result
          path: artifacts/selected-output-lock
          if-no-files-found: warn
          retention-days: 14

  shared-support-platforms:
    name: Shared support (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Gate exact shared process support
        run: >-
          node scripts/test-oracles/run-core-test-lane.mjs
          --test Sunder.Core.TestSupport.Tests.TestSupportFaultProbeTests.CapturedProcess_NonzeroExitSurfacesStdoutAndStderrDiagnostics

      - name: Test shared process support on platform
        run: |
          dotnet restore languages/csharp/dotnet/tests/Sunder.Core.TestSupport.Tests/Sunder.Core.TestSupport.Tests.csproj --locked-mode
          dotnet test languages/csharp/dotnet/tests/Sunder.Core.TestSupport.Tests/Sunder.Core.TestSupport.Tests.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            --filter FullyQualifiedName~CapturedProcess_NonzeroExitSurfacesStdoutAndStderrDiagnostics \
            --logger "trx;LogFileName=Sunder.Core.TestSupport.Tests.trx" \
            --results-directory artifacts/shared-support-${{ runner.os }}/dotnet

      - name: Summarize shared process support
        if: always()
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/shared-support-${{ runner.os }}
          --allow-partial
          --require-test Sunder.Core.TestSupport.Tests.TestSupportFaultProbeTests.CapturedProcess_NonzeroExitSurfacesStdoutAndStderrDiagnostics

      - name: Upload shared process support result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-oracle-shared-support-${{ runner.os }}
          path: artifacts/shared-support-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
