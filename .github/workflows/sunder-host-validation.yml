name: Sunder Native Validation

on:
  workflow_call:

permissions:
  contents: read
env:
  DOTNET_VERSION: "10.0.100"
  NODE_VERSION: "24.18.1"
  NPM_VERSION: "11.19.0"

jobs:
  platform:
    name: Platform/process behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare native/process prerequisites
        shell: bash
        run: |
          npm install --global "npm@$NPM_VERSION" --registry=https://registry.npmjs.org
          npm ci --prefix languages/typescript/node
          npm run build --prefix languages/typescript/node
          npm exec --prefix languages/typescript/node -- tsc -p languages/typescript/node/packages/package-tool/tsconfig.test.json
          dotnet restore Sunder.Core.slnx --locked-mode
      - name: Execute the platform lane
        env:
          SUNDER_RUN_EXTERNAL_KEYSTORE_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
          SUNDER_REQUIRE_NODE24_HOST_INTEGRATION: "1"
        run: >-
          node scripts/test-oracles/run-dotnet-tests-with-results.mjs --primary-lane host-platform
          --results-directory artifacts/test-results/platform --build --configuration Release --disable-build-servers
      - name: Verify bundled App, Supervisor, Runtime and CLI outputs
        run: >-
          node scripts/test-oracles/run-dotnet-tests-with-results.mjs --primary-lane app-packaging
          --results-directory artifacts/test-results/app-packaging --build --configuration Release
      - if: always()
        run: node scripts/test-oracles/summarize-core-test-results.mjs artifacts/test-results/platform --allow-partial --require-primary-lane host-platform
      - if: always()
        run: node scripts/test-oracles/summarize-core-test-results.mjs artifacts/test-results/app-packaging --allow-partial --require-primary-lane app-packaging
      - name: Parse Windows packaging and installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("scripts/install/install.ps1", "scripts/release/package-sunder.ps1")) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-platform-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

  official-runtimes:
    name: Official runtime native launch (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, os: windows-2022}
          - {rid: win-arm64, os: windows-11-arm}
          - {rid: linux-x64, os: ubuntu-24.04}
          - {rid: linux-arm64, os: ubuntu-24.04-arm}
          - {rid: osx-x64, os: macos-15-intel}
          - {rid: osx-arm64, os: macos-15}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare both Worker languages
        shell: bash
        run: |
          npm install --global "npm@$NPM_VERSION" --registry=https://registry.npmjs.org
          npm ci --prefix languages/typescript/node
          npm run build --prefix languages/typescript/node
          npm exec --prefix languages/typescript/node -- tsc -p languages/typescript/node/packages/package-tool/tsconfig.test.json
          dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode
      - name: Pack the exact native Worker archive
        shell: pwsh
        run: |
          dotnet msbuild languages/csharp/dotnet/tests/Sunder.Package.Build.TestFixtures/WorkerV1Executable/WorkerV1Executable.csproj `
            -t:PackSunderPackage -p:Configuration=Release -p:RuntimeIdentifier=${{ matrix.rid }} `
            -p:SunderPackageOutputPath="$env:RUNNER_TEMP/test.worker.v1.executable.1.0.0.sunderpkg"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run actual vendor installation and native Worker tests
        env:
          SUNDER_REQUIRE_NODE24_HOST_INTEGRATION: "1"
          SUNDER_REQUIRE_DOTNET_WORKER_ARTIFACT: "1"
          SUNDER_DOTNET_WORKER_ARCHIVE_PATH: ${{ runner.temp }}/test.worker.v1.executable.1.0.0.sunderpkg
          SUNDER_WORKER_RELEASE_METRICS_PATH: ${{ github.workspace }}/artifacts/test-results/official/dotnet-worker-${{ matrix.rid }}.json
        run: >-
          dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj
          -c Release --no-restore -p:GeneratePackageOnBuild=false --filter "Category=CurrentRidExecutionRuntime|FullyQualifiedName~WorkerSdkPackagedExecutable"
          --logger trx --results-directory artifacts/test-results/official
      - name: Require executed native results
        if: always()
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs artifacts/test-results/official --allow-partial
          --require-test Sunder.Runtime.Host.Tests.CurrentRidDotNetRuntimeHostIntegrationTests.OfficialCurrentRidDotNetRuntime_LaunchesThinWorkerAndRebindIsAtomic
          --require-test Sunder.Runtime.Host.Tests.CurrentRidNodeRuntimeHostIntegrationTests.OfficialCurrentRidNode24Runtime_LaunchesThinWorkerAndRoutesCrossLanguageRpc
          --require-test Sunder.Runtime.Host.Tests.ProcessRuntimeWorkerTests.WorkerSdkPackagedExecutable_ExactArchiveInstallsThroughRuntimeHostAndRecordsReleaseEvidence
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-runtime-${{ matrix.rid }}
          path: artifacts/test-results/official
          if-no-files-found: error

  packaging:
    name: Unsigned packaging smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}
            9.0.100
      - name: Build the strict unsigned Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools
          dotnet new globaljson --sdk-version 9.0.100 --roll-forward disable --output "$RUNNER_TEMP/velopack-sdk"
          (cd "$RUNNER_TEMP/velopack-sdk" && dotnet tool install --tool-path "$RUNNER_TEMP/velopack" vpk --version 1.2.161)
          PATH="$RUNNER_TEMP/velopack:$PATH" bash scripts/release/package-sunder.sh \
            --version 1.0.0-smoke.1 --runtime linux-x64 --output-root "$RUNNER_TEMP/linux-package" --strict-release
          git diff --exit-code -- ':(glob)languages/csharp/dotnet/**/packages.lock.json'
          test -f "$RUNNER_TEMP/linux-package/velopack/stable/linux-x64/Sunder-app-linux-x64-stable.AppImage"
          test -f "$RUNNER_TEMP/linux-package/velopack/stable/linux-x64/Sunder-1.0.0-smoke.1-app-linux-x64-stable-full.nupkg"
      - name: Build and inspect the branded DMG layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          swiftc -typecheck scripts/release/macos/render-sunder-dmg-background.swift
          app="$RUNNER_TEMP/dmg-fixture/Sunder.app"
          mkdir -p "$app/Contents/MacOS"
          python3 - "$app" <<'PY'
          import pathlib, plistlib, sys
          root = pathlib.Path(sys.argv[1]) / 'Contents'
          (root / 'Info.plist').write_bytes(plistlib.dumps(dict(CFBundleExecutable='Sunder', CFBundleIdentifier='com.younics.sunder.fixture', CFBundleName='Sunder', CFBundlePackageType='APPL')))
          (root / 'MacOS/Sunder').write_text('#!/usr/bin/env bash\nexit 0\n')
          (root / 'MacOS/Sunder').chmod(0o755)
          PY
          dmg="$RUNNER_TEMP/Sunder.dmg"
          mount="$RUNNER_TEMP/dmg-mount"
          bash scripts/release/macos/create-sunder-dmg.sh --app "$app" --output "$dmg"
          hdiutil verify "$dmg" >/dev/null
          mkdir "$mount"
          trap 'hdiutil detach "$mount" -quiet >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg" >/dev/null
          test -d "$mount/Sunder.app"
          test -L "$mount/Applications" && test "$(readlink "$mount/Applications")" = /Applications
          test -s "$mount/.background/Sunder.tiff" && test -s "$mount/.DS_Store"
          visible=("$mount"/*); hidden=("$mount"/.[!.]*)
          test "${#visible[@]}" = 2 && test "${#hidden[@]}" = 2
          info="$(tiffutil -info "$mount/.background/Sunder.tiff")"
          grep -q 'Image Width: 820 Image Length: 460' <<< "$info"
          grep -q 'Image Width: 1640 Image Length: 920' <<< "$info"
