name: Sunder Native Validation

on:
  workflow_call:
    inputs:
      scope:
        type: string
        required: true

permissions:
  contents: read
env:
  CI_SCOPE: ${{ inputs.scope }}

jobs:
  prepare:
    name: Native — Select components, platforms and partitions
    runs-on: ubuntu-24.04
    outputs:
      platform: ${{ steps.platforms.outputs.platform }}
      consumers: ${{ steps.platforms.outputs.consumers }}
      platform_tests: ${{ steps.platforms.outputs.platform_tests }}
      consumer_tests: ${{ steps.platforms.outputs.consumer_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: platforms
        run: python3 -B scripts/ci/metadata.py components --scope "$CI_SCOPE"

  platform:
    name: ${{ matrix.job_name }}
    needs: prepare
    if: needs.prepare.outputs.platform_tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.platform) }}
    env:
      CI_COMPONENT: ${{ matrix.scope }}
      NATIVE_PARTITION: ${{ matrix.partition }}
      CI_JOB_NAME: ${{ matrix.job_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dotnet: 'false'
      - name: Verify owned test process cleanup on the native OS
        id: process_preflight
        env:
          SUNDER_TEST_PROCESS_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}/artifacts/process-preflight
        run: >-
          node scripts/test-oracles/run-node-tests-with-results.mjs --results-directory artifacts/process-preflight
          node-process-preflight scripts/test-oracles/owned-test-process.test.mjs
      - name: Retain process preflight diagnostics
        if: always() && steps.process_preflight.outcome != 'skipped' && steps.process_preflight.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-process-preflight-${{ inputs.scope }}-${{ matrix.scope }}-${{ matrix.rid }}${{ matrix.artifact_suffix }}
          path: artifacts/process-preflight
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build and test selected native component
        id: platform_tests
        shell: bash
        run: python3 -B scripts/ci/core_ci.py platform --scope "$CI_COMPONENT" --partition "$NATIVE_PARTITION"
      - name: Retain platform test results
        if: always() && steps.platform_tests.outcome != 'skipped' && steps.platform_tests.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-results-${{ inputs.scope }}-platform-${{ matrix.scope }}-${{ matrix.rid }}${{ matrix.artifact_suffix }}
          path: artifacts/test-results/${{ matrix.scope }}
          if-no-files-found: error
          retention-days: 14
      - name: Summarize native execution
        if: always()
        shell: bash
        env:
          SUNDER_CI_STEPS: ${{ toJSON(steps) }}
          CI_REPORT_ARTIFACT: sunder-results-${{ inputs.scope }}-platform-${{ matrix.scope }}-${{ matrix.rid }}${{ matrix.artifact_suffix }}
        run: python3 -B scripts/ci/report.py job --directory "artifacts/test-results/$CI_COMPONENT"

  consumers:
    name: ${{ matrix.job_name }}
    # Share capacity with platform tests; official launch and packaging together
    # also stay within the six-runner budget.
    needs: [prepare, platform]
    if: ${{ !cancelled() && needs.prepare.outputs.consumer_tests == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.consumers) }}
    env:
      CI_COMPONENT: ${{ matrix.scope }}
      RID: ${{ matrix.rid }}
      CI_JOB_NAME: ${{ matrix.job_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.task == 'official' && 'true' || 'false' }}
          packaging: ${{ matrix.task == 'packaging' && 'true' || 'false' }}
      - name: Install Linux packaging prerequisites
        if: matrix.task == 'packaging' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools
      - name: Install Velopack CLI
        if: matrix.task == 'packaging' && runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/release/install-velopack.ps1
      - name: Build and test official runtimes
        id: official_tests
        if: matrix.task == 'official'
        shell: bash
        run: python3 -B scripts/ci/core_ci.py official --scope "$CI_COMPONENT" --rid "$RID"
      - name: Exercise unsigned native packaging
        id: packaging
        if: matrix.task == 'packaging'
        shell: bash
        run: python3 -B scripts/ci/core_ci.py packaging --scope app --rid "$RID"
      - name: Retain native consumer results
        if: always() && (steps.official_tests.outcome == 'success' || steps.official_tests.outcome == 'failure' || steps.official_tests.outcome == 'cancelled' || steps.packaging.outcome == 'success' || steps.packaging.outcome == 'failure' || steps.packaging.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-results-${{ inputs.scope }}-${{ matrix.task }}-${{ matrix.scope }}-${{ matrix.rid }}
          path: artifacts/test-results/${{ matrix.scope }}
          if-no-files-found: error
          retention-days: 14
      - name: Summarize native consumer results
        if: always()
        shell: bash
        env:
          SUNDER_CI_STEPS: ${{ toJSON(steps) }}
          CI_REPORT_ARTIFACT: sunder-results-${{ inputs.scope }}-${{ matrix.task }}-${{ matrix.scope }}-${{ matrix.rid }}
        run: python3 -B scripts/ci/report.py job --directory "artifacts/test-results/$CI_COMPONENT"
