name: Sunder Host Validation

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.100"

jobs:
  supervisor-and-runtime:
    name: Supervisor and Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Host tests
        run: |
          dotnet restore tests/Sunder.Host.Supervisor.Tests/Sunder.Host.Supervisor.Tests.csproj --locked-mode
          dotnet restore tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode

      - name: Test Supervisor and Runtime
        env:
          SUNDER_RUN_EXTERNAL_KEYSTORE_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          dotnet test tests/Sunder.Host.Supervisor.Tests/Sunder.Host.Supervisor.Tests.csproj -c Release --no-restore
          dotnet test tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj -c Release --no-restore
