name: Sunder Host Validation

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/sunder-host-validation.yml"
      - "languages/csharp/dotnet/Directory.Build.props"
      - "languages/csharp/dotnet/Directory.Packages.props"
      - "languages/csharp/dotnet/host/**"
      - "languages/csharp/dotnet/libraries/**"
      - "languages/csharp/dotnet/packages/Sunder.Sdk/**"
      - "languages/csharp/dotnet/packages/Sunder.Sdk.Worker/**"
      - "languages/csharp/dotnet/tests/Sunder.Host.Supervisor.Tests/**"
      - "languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sunder-host-validation.yml"
      - "languages/csharp/dotnet/Directory.Build.props"
      - "languages/csharp/dotnet/Directory.Packages.props"
      - "languages/csharp/dotnet/host/**"
      - "languages/csharp/dotnet/libraries/**"
      - "languages/csharp/dotnet/packages/Sunder.Sdk/**"
      - "languages/csharp/dotnet/packages/Sunder.Sdk.Worker/**"
      - "languages/csharp/dotnet/tests/Sunder.Host.Supervisor.Tests/**"
      - "languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/**"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.100"

jobs:
  supervisor-and-runtime:
    name: Supervisor and Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Host tests
        run: |
          dotnet restore languages/csharp/dotnet/tests/Sunder.Host.Supervisor.Tests/Sunder.Host.Supervisor.Tests.csproj --locked-mode
          dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode

      - name: Test Supervisor and Runtime
        env:
          SUNDER_RUN_EXTERNAL_KEYSTORE_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          dotnet test languages/csharp/dotnet/tests/Sunder.Host.Supervisor.Tests/Sunder.Host.Supervisor.Tests.csproj -c Release --no-restore
          dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj -c Release --no-restore
