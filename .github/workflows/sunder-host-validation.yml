name: Sunder Native Validation

on:
  workflow_call:
    inputs:
      include-app-packaging:
        description: Validate bundled App outputs and installer packaging.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.platforms.outputs.native }}
      packaging: ${{ steps.platforms.outputs.packaging }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: platforms
        run: python3 -B scripts/ci/metadata.py matrices

  platform:
    name: Platform/process behavior (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.native) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dotnet: 'false'
      - name: Verify owned test process cleanup on the native OS
        id: process_preflight
        env:
          SUNDER_TEST_PROCESS_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}/artifacts/process-preflight
        run: >-
          node scripts/test-oracles/run-node-tests-with-results.mjs --results-directory artifacts/process-preflight
          node-process-preflight scripts/test-oracles/owned-test-process.test.mjs
      - name: Retain process preflight diagnostics
        if: always() && steps.process_preflight.outcome != 'skipped' && steps.process_preflight.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-process-preflight-${{ matrix.rid }}
          path: artifacts/process-preflight
          if-no-files-found: error
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare native/process prerequisites
        shell: bash
        run: |
          node scripts/test-oracles/check-core-test-policy.mjs
          python3 -B scripts/ci/core_ci.py node-inputs
          dotnet restore Sunder.Core.slnx --locked-mode
      - name: Execute the platform lane
        id: platform_tests
        env:
          SUNDER_RUN_EXTERNAL_KEYSTORE_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
          SUNDER_REQUIRE_NODE24_HOST_INTEGRATION: "1"
        run: >-
          node scripts/test-oracles/run-dotnet-tests-with-results.mjs --primary-lane host-platform
          --results-directory artifacts/test-results/platform --build --configuration Release --disable-build-servers
      - name: Windows cross-language output locks
        id: output_lock_interop
        if: runner.os == 'Windows'
        run: >-
          node scripts/test-oracles/run-dotnet-tests-with-results.mjs --scenario output-lock
          --results-directory artifacts/test-results/lock-interop --configuration Release
      - name: Require executed Windows output-lock interoperability
        if: always() && (steps.output_lock_interop.outcome == 'success' || steps.output_lock_interop.outcome == 'failure')
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs artifacts/test-results/lock-interop
          --allow-partial --require-scenario output-lock
      - name: Verify bundled App, Supervisor, Runtime and CLI outputs
        id: app_packaging
        if: success() && inputs.include-app-packaging
        run: >-
          node scripts/test-oracles/run-dotnet-tests-with-results.mjs --primary-lane app-packaging
          --results-directory artifacts/test-results/app-packaging --build --configuration Release
      - name: Summarize platform test evidence
        if: always() && (steps.platform_tests.outcome == 'success' || steps.platform_tests.outcome == 'failure')
        run: node scripts/test-oracles/summarize-core-test-results.mjs artifacts/test-results/platform --allow-partial --require-primary-lane host-platform
      - name: Summarize App packaging test evidence
        if: always() && (steps.app_packaging.outcome == 'success' || steps.app_packaging.outcome == 'failure')
        run: node scripts/test-oracles/summarize-core-test-results.mjs artifacts/test-results/app-packaging --allow-partial --require-primary-lane app-packaging
      - name: Parse Windows packaging and installer scripts
        if: runner.os == 'Windows' && inputs.include-app-packaging
        shell: pwsh
        run: ./scripts/ci/check-powershell.ps1
      - name: Retain platform test results
        if: always() && steps.platform_tests.outcome != 'skipped' && steps.platform_tests.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-platform-${{ matrix.rid }}
          path: artifacts/test-results
          if-no-files-found: error

  official-runtimes:
    name: Official runtime native launch (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.native) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare both Worker languages
        shell: bash
        run: |
          python3 -B scripts/ci/core_ci.py node-inputs
          node --test languages/typescript/node/packages/package-tool/dist-test/test/rpc-runtime-inputs.test.js
          dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode
      - name: Pack the exact native Worker archive
        env:
          RID: ${{ matrix.rid }}
        shell: bash
        run: python3 -B scripts/ci/core_ci.py official-inputs --rid "$RID"
      - name: Run actual vendor installation and native Worker tests
        id: official_tests
        run: >-
          node scripts/test-oracles/run-dotnet-tests-with-results.mjs --scenario official --build
          --configuration Release --results-directory artifacts/test-results/official
      - name: Require executed native results
        if: always() && (steps.official_tests.outcome == 'success' || steps.official_tests.outcome == 'failure')
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs artifacts/test-results/official
          --allow-partial --require-scenario official
      - name: Retain official runtime test results
        if: always() && steps.official_tests.outcome != 'skipped' && steps.official_tests.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-runtime-${{ matrix.rid }}
          path: artifacts/test-results/official
          if-no-files-found: error

  packaging:
    name: Unsigned packaging smoke (${{ matrix.rid }})
    needs: prepare
    if: inputs.include-app-packaging
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.packaging) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          packaging: 'true'
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools
      - name: Install Velopack CLI
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/release/install-velopack.ps1
      - name: Exercise unsigned native packaging
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: bash scripts/test/release/smoke-app-packaging.sh "$RID"
