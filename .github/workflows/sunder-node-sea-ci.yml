name: Sunder Node SEA CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sunder-node-sea-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.1"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  typescript:
    name: TypeScript SDK, tooling, and template
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      npm_version: ${{ steps.sdk-metadata.outputs.npm_version }}
      npm_version_range: ${{ steps.sdk-metadata.outputs.npm_version_range }}
      sdk_version: ${{ steps.sdk-metadata.outputs.version }}
      vite_version: ${{ steps.sdk-metadata.outputs.vite_version }}
    defaults:
      run:
        working-directory: languages/typescript/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json
      - name: Verify coordinated SDK and Node metadata
        id: sdk-metadata
        run: node ../../../scripts/release/check-sdk-version.mjs
      - name: Install exact packageManager npm
        env:
          NPM_VERSION: ${{ steps.sdk-metadata.outputs.npm_version }}
        run: |
          npm install --global "npm@${{ steps.sdk-metadata.outputs.npm_version }}" --registry=https://registry.npmjs.org
          node -e "const actual = require('node:child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (actual !== process.env.NPM_VERSION) throw new Error('Expected npm ' + process.env.NPM_VERSION + ', found ' + actual);"
      - run: npm ci
      - run: npm ls --all
      - name: Require Node execution lane
        run: node ../../../scripts/test-oracles/run-core-test-lane.mjs --primary-lane node
      - name: Test Node SDK, tooling, templates, and Core scripts with JUnit
        run: node ../../../scripts/test-oracles/run-node-test-matrix-with-results.mjs
      - name: Summarize Node results
        if: always()
        run: >-
          node ../../../scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results
          --allow-partial
          --require-primary-lane node
      - name: Upload Node results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Pack and verify exact npm artifacts
        env:
          NPM_VERSION_RANGE: ${{ steps.sdk-metadata.outputs.npm_version_range }}
          SDK_VERSION: ${{ steps.sdk-metadata.outputs.version }}
          VITE_VERSION: ${{ steps.sdk-metadata.outputs.vite_version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sunder-node-packages"
          mkdir -p "$output"
          npm pack --json \
            --pack-destination "$output" \
            --workspace @sunder/sdk \
            --workspace @sunder/package-tool \
            --workspace create-sunder-package \
            > "$RUNNER_TEMP/npm-pack.json"
          node ../../../scripts/release/verify-node-package-artifacts.mjs \
            "$SDK_VERSION" "$NPM_VERSION_RANGE" "$VITE_VERSION" "$output" "$RUNNER_TEMP/npm-pack.json"

  output-lock-interop:
    name: Required Node and .NET output-lock interop
    needs: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: languages/typescript/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.100
      - name: Build the exact Node test helper
        run: |
          set -euo pipefail
          npm install --global "npm@${{ needs.typescript.outputs.npm_version }}" --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "${{ needs.typescript.outputs.npm_version }}" ]]
          npm ci
          ./node_modules/.bin/tsc -p packages/package-tool/tsconfig.test.json
          test -f packages/package-tool/dist-test/test/output-child.js
      - name: Require cross-language output-lock behavior
        env:
          SUNDER_REQUIRE_NODE_OUTPUT_LOCK_INTEROP: "1"
        run: |
          dotnet restore ../../csharp/dotnet/tests/Sunder.Package.Build.Tests/Sunder.Package.Build.Tests.csproj --locked-mode
          dotnet test ../../csharp/dotnet/tests/Sunder.Package.Build.Tests/Sunder.Package.Build.Tests.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            --filter FullyQualifiedName~SharedOutputLock_InteroperatesWithNodeProducerWhenAvailable \
            --logger "trx;LogFileName=Sunder.Package.Build.Tests.trx" \
            --results-directory ../../../artifacts/test-results/node-output-lock
      - name: Summarize required output-lock result
        if: always()
        run: >-
          node ../../../scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results/node-output-lock
          --allow-partial
          --require-test Sunder.Package.Build.Tests.PackageBuildManifestTests.SharedOutputLock_InteroperatesWithNodeProducerWhenAvailable
      - name: Upload required output-lock result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-output-lock-results
          path: artifacts/test-results/node-output-lock
          if-no-files-found: warn
          retention-days: 14

  native-sea:
    name: Native SEA ${{ matrix.rid }}
    needs: typescript
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
          - rid: win-arm64
            runner: windows-11-arm
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          # Upstream Node SEA CI skips macOS x64. This native Sunder smoke is mandatory.
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: languages/typescript/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.100
      - name: Install exact packageManager npm
        env:
          NPM_VERSION: ${{ needs.typescript.outputs.npm_version }}
        run: |
          npm install --global "npm@${{ needs.typescript.outputs.npm_version }}" --registry=https://registry.npmjs.org
          node -e "const actual = require('node:child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (actual !== process.env.NPM_VERSION) throw new Error('Expected npm ' + process.env.NPM_VERSION + ', found ' + actual);"
      - run: npm ci
      - run: npm ls --all
      - run: npm run build
      - name: Build pinned exact-RID SEA leaf
        run: npm run sea:build -- --rid ${{ matrix.rid }} --allow-unsigned-windows
      - name: Native protocol-handshake smoke
        run: npm run sea:smoke -- --rid ${{ matrix.rid }}
      - name: Package exact current-RID SEA leaf
        run: npm run sea:package -- --discovery-root fixtures/sea-smoke/dist/targets --leaf fixtures/sea-smoke/dist/targets/${{ matrix.rid }}
      - name: Restore Runtime Host interoperability tests
        run: dotnet restore ../../csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode
      - name: Run exact SEA through the real Runtime Host
        env:
          SUNDER_NODE_SEA_PACKAGE_PATH: ${{ github.workspace }}/languages/typescript/node/fixtures/sea-smoke/dist/sunder.sea.smoke.1.0.0.sunderpkg
          SUNDER_NODE_SEA_LEAF_PATH: ${{ github.workspace }}/languages/typescript/node/fixtures/sea-smoke/dist/targets/${{ matrix.rid }}
          SUNDER_REQUIRE_NODE_SEA_INTEROP: "1"
          SUNDER_WORKER_RELEASE_METRICS_PATH: ${{ github.workspace }}/artifacts/worker-v3/node-sea-${{ matrix.rid }}.json
        run: >-
          dotnet test ../../csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj
          --configuration Release
          --no-restore
          -m:1
          --filter FullyQualifiedName~CrossLanguageWorkerRuntimeHostTests
          --disable-build-servers
          --logger "trx;LogFileName=Sunder.Runtime.Host.Tests.trx"
          --results-directory ../../../artifacts/test-results/node-sea-${{ matrix.rid }}
      - name: Summarize Runtime Host SEA interoperability
        if: always()
        run: >-
          node ../../../scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results/node-sea-${{ matrix.rid }}
          --allow-partial
          --require-test Sunder.Runtime.Host.Tests.CrossLanguageWorkerRuntimeHostTests.DotNetToNode_RealRuntimeHostRunsNativeSeaUnaryStreamDataFaultAndShutdown
          --require-test Sunder.Runtime.Host.Tests.CrossLanguageWorkerRuntimeHostTests.NodeToDotNet_RealRuntimeHostRoutesRpcToNativeDotNetWorker
      - name: Upload Runtime Host SEA interoperability results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-sea-results-${{ matrix.rid }}
          path: artifacts/test-results/node-sea-${{ matrix.rid }}
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-sea-leaf-${{ matrix.rid }}
          path: languages/typescript/node/fixtures/sea-smoke/dist/targets/${{ matrix.rid }}
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-worker-v3-node-sea-evidence-${{ matrix.rid }}
          path: artifacts/worker-v3/node-sea-${{ matrix.rid }}.json
          if-no-files-found: error

  universal-package:
    name: Six-RID universal package fan-in
    needs:
      - typescript
      - native-sea
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: languages/typescript/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.100
      - name: Install exact packageManager npm
        env:
          NPM_VERSION: ${{ needs.typescript.outputs.npm_version }}
        run: |
          npm install --global "npm@${{ needs.typescript.outputs.npm_version }}" --registry=https://registry.npmjs.org
          node -e "const actual = require('node:child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (actual !== process.env.NPM_VERSION) throw new Error('Expected npm ' + process.env.NPM_VERSION + ', found ' + actual);"
      - run: npm ci
      - run: npm ls --all
      - run: npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-sea-leaf-*
          path: languages/typescript/node/artifacts/sea-leaves
          merge-multiple: false
      - name: Aggregate exact-RID leaves
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t leaf_artifacts < <(find "$PWD/artifacts/sea-leaves" -mindepth 1 -maxdepth 1 -type d | sort)
          [[ ${#leaf_artifacts[@]} -eq 6 ]] \
            || { echo "Expected exactly six downloaded SEA leaf artifacts, found ${#leaf_artifacts[@]}." >&2; exit 1; }
          args=()
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            leaf="$PWD/artifacts/sea-leaves/sunder-sea-leaf-$rid"
            test -d "$leaf" || { echo "Missing exact SEA leaf artifact: $leaf" >&2; exit 1; }
            args+=(--leaf "$leaf")
          done
          node packages/package-tool/dist/cli.js package --project fixtures/sea-smoke --discovery-root "$PWD/artifacts/sea-leaves" "${args[@]}"
          package="$PWD/fixtures/sea-smoke/dist/sunder.sea.smoke.1.0.0.sunderpkg"
          test -f "$package"
          unzip -t "$package"
      - name: Validate universal package with .NET inspector
        env:
          SUNDER_NODE_SEA_PACKAGE_PATH: ${{ github.workspace }}/languages/typescript/node/fixtures/sea-smoke/dist/sunder.sea.smoke.1.0.0.sunderpkg
          SUNDER_NODE_SEA_EXPECTED_RIDS: win-x64,win-arm64,linux-x64,linux-arm64,osx-x64,osx-arm64
          SUNDER_REQUIRE_NODE_SEA_PACKAGE: "1"
        run: >-
          dotnet test ../../csharp/dotnet/tests/Sunder.Package.Format.Tests/Sunder.Package.Format.Tests.csproj
          --configuration Release
          -m:1
          --filter FullyQualifiedName~NodePackageArchiveCompatibilityTests
          --disable-build-servers
          --logger "trx;LogFileName=Sunder.Package.Format.Tests.trx"
          --results-directory ../../../artifacts/test-results/node-sea-universal
      - name: Summarize universal SEA package validation
        if: always()
        run: >-
          node ../../../scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results/node-sea-universal
          --allow-partial
          --require-test Sunder.Package.Format.Tests.NodePackageArchiveCompatibilityTests.NodePackageArchive_WhenConfigured_IsAcceptedByDotNetInspector
      - name: Upload universal SEA package validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-sea-universal-results
          path: artifacts/test-results/node-sea-universal
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-sea-smoke-universal-package
          path: languages/typescript/node/fixtures/sea-smoke/dist/sunder.sea.smoke.1.0.0.sunderpkg
          if-no-files-found: error
