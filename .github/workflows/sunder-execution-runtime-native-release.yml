name: Sunder Execution Runtime Native Release

on:
  push:
    tags:
      - "runtime/v*"

permissions: {}

concurrency:
  group: sunder-execution-runtime-native-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.100"
  PRODUCTION_LOCK: eng/execution-runtimes/production.lock.json
  SUNDER_EXECUTION_RUNTIME_BUILD_PHASE: native
  SUNDER_CORE_RELEASE_APPROVED: ${{ vars.SUNDER_CORE_RELEASE_APPROVED }}
  SUNDER_CORE_RELEASE_APPROVAL_REFERENCE: ${{ vars.SUNDER_CORE_RELEASE_APPROVAL_REFERENCE }}
  SUNDER_CORE_ARTIFACT_SOURCE_COMMIT: ${{ vars.SUNDER_CORE_ARTIFACT_SOURCE_COMMIT }}
  SUNDER_CORE_SDK_TAG: ${{ vars.SUNDER_CORE_SDK_TAG }}
  SUNDER_EXECUTION_RUNTIME_LOCK_SHA256: ${{ vars.SUNDER_EXECUTION_RUNTIME_LOCK_SHA256 }}

jobs:
  approval-gate:
    name: Fail-closed production approval gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sunder-execution-runtime-native-release
    outputs:
      release_id: ${{ steps.source.outputs.release_id }}
    permissions:
      contents: read
    env:
      SUNDER_EXECUTION_RUNTIME_SOURCES_APPROVED: ${{ vars.SUNDER_EXECUTION_RUNTIME_SOURCES_APPROVED }}
      SUNDER_EXECUTION_RUNTIME_SOURCES_APPROVAL_REFERENCE: ${{ vars.SUNDER_EXECUTION_RUNTIME_SOURCES_APPROVAL_REFERENCE }}
      SUNDER_EXECUTION_RUNTIME_SIGNERS_APPROVED: ${{ vars.SUNDER_EXECUTION_RUNTIME_SIGNERS_APPROVED }}
      SUNDER_EXECUTION_RUNTIME_SIGNERS_APPROVAL_REFERENCE: ${{ vars.SUNDER_EXECUTION_RUNTIME_SIGNERS_APPROVAL_REFERENCE }}
      SUNDER_EXECUTION_RUNTIME_RUNNERS_APPROVED: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNERS_APPROVED }}
      SUNDER_EXECUTION_RUNTIME_RUNNERS_APPROVAL_REFERENCE: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNERS_APPROVAL_REFERENCE }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_SIGNER_ADAPTER: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_SIGNER_ADAPTER }}
      SUNDER_EXECUTION_RUNTIME_ATTESTATION_SIGNER_ADAPTER: ${{ vars.SUNDER_EXECUTION_RUNTIME_ATTESTATION_SIGNER_ADAPTER }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_PUBLIC_KEYS: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_PUBLIC_KEYS }}
      SUNDER_EXECUTION_RUNTIME_ATTESTATION_PUBLIC_KEYS: ${{ vars.SUNDER_EXECUTION_RUNTIME_ATTESTATION_PUBLIC_KEYS }}
      SUNDER_EXECUTION_RUNTIME_COORDINATOR_RUNNER: ${{ vars.SUNDER_EXECUTION_RUNTIME_COORDINATOR_RUNNER }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_ARM64 }}
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore lock validator
        run: dotnet restore languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/Sunder.ExecutionRuntime.Build.csproj --locked-mode

      - name: Require the approved tagged artifact source and numeric draft
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_ID }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_coordinates.py runtime --release-id "$RELEASE_ID"
          printf 'release_id=%s\n' "$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Require approved production lock, sources, signers, and native runners
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/execution-runtimes/native-release-preflight.sh --lock "$PRODUCTION_LOCK" --phase native

  native-build:
    name: Native signed runtimes (${{ matrix.rid }})
    needs: approval-gate
    runs-on: ${{ vars[matrix.runner_variable] }}
    timeout-minutes: 240
    environment: sunder-execution-runtime-native-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_X64
            profile_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_X64
            driver_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_X64
            driver_sha_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_X64
          - rid: win-arm64
            runner_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_ARM64
            profile_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_ARM64
            driver_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_ARM64
            driver_sha_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_ARM64
          - rid: linux-x64
            runner_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_X64
            profile_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_X64
            driver_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_X64
            driver_sha_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_X64
          - rid: linux-arm64
            runner_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_ARM64
            profile_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_ARM64
            driver_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_ARM64
            driver_sha_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_ARM64
          - rid: osx-x64
            runner_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_X64
            profile_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_X64
            driver_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_X64
            driver_sha_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_X64
          - rid: osx-arm64
            runner_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_ARM64
            profile_variable: SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_ARM64
            driver_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_ARM64
            driver_sha_variable: SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_ARM64
    env:
      RUNNER_PROFILE: ${{ vars[matrix.profile_variable] }}
      SUNDER_EXECUTION_RUNTIME_SOURCES_APPROVED: ${{ vars.SUNDER_EXECUTION_RUNTIME_SOURCES_APPROVED }}
      SUNDER_EXECUTION_RUNTIME_SOURCES_APPROVAL_REFERENCE: ${{ vars.SUNDER_EXECUTION_RUNTIME_SOURCES_APPROVAL_REFERENCE }}
      SUNDER_EXECUTION_RUNTIME_SIGNERS_APPROVED: ${{ vars.SUNDER_EXECUTION_RUNTIME_SIGNERS_APPROVED }}
      SUNDER_EXECUTION_RUNTIME_SIGNERS_APPROVAL_REFERENCE: ${{ vars.SUNDER_EXECUTION_RUNTIME_SIGNERS_APPROVAL_REFERENCE }}
      SUNDER_EXECUTION_RUNTIME_RUNNERS_APPROVED: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNERS_APPROVED }}
      SUNDER_EXECUTION_RUNTIME_RUNNERS_APPROVAL_REFERENCE: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNERS_APPROVAL_REFERENCE }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_SIGNER_ADAPTER: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_SIGNER_ADAPTER }}
      SUNDER_EXECUTION_RUNTIME_ATTESTATION_SIGNER_ADAPTER: ${{ vars.SUNDER_EXECUTION_RUNTIME_ATTESTATION_SIGNER_ADAPTER }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER: ${{ vars[matrix.driver_variable] }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256: ${{ vars[matrix.driver_sha_variable] }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_PUBLIC_KEYS: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_PUBLIC_KEYS }}
      SUNDER_EXECUTION_RUNTIME_ATTESTATION_PUBLIC_KEYS: ${{ vars.SUNDER_EXECUTION_RUNTIME_ATTESTATION_PUBLIC_KEYS }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_OSX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RUNNER_PROFILE_OSX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_OSX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_ARM64 }}
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore release validator
        run: dotnet restore languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/Sunder.ExecutionRuntime.Build.csproj --locked-mode

      - name: Build, reverify, and reproduce approved native runtime candidates
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/sunder-runtime-first-$RID"
          second="$RUNNER_TEMP/sunder-runtime-second-$RID"
          first_receipt="$RUNNER_TEMP/sunder-runtime-first-$RID.json"
          second_receipt="$RUNNER_TEMP/sunder-runtime-second-$RID.json"
          bash scripts/execution-runtimes/native-release.sh \
            --lock "$PRODUCTION_LOCK" --rid "$RID" --runner-profile "$RUNNER_PROFILE" \
            --output "$first" --receipt "$first_receipt"
          bash scripts/execution-runtimes/native-release.sh \
            --lock "$PRODUCTION_LOCK" --rid "$RID" --runner-profile "$RUNNER_PROFILE" \
            --output "$second" --receipt "$second_receipt"

          shopt -s nullglob
          first_archives=("$first"/*.sunderruntime)
          second_archives=("$second"/*.sunderruntime)
          [[ ${#first_archives[@]} -eq 2 && ${#second_archives[@]} -eq 2 ]]
          for first_archive in "${first_archives[@]}"; do
            name="$(basename "$first_archive")"
            [[ -f "$second/$name" ]]
            cmp "$first_archive" "$second/$name"
          done
          cmp "$first_receipt" "$second_receipt"

          final="artifacts/execution-runtimes/$RID"
          final_receipt="artifacts/execution-runtime-receipts/$RID.json"
          verified_final_receipt="$RUNNER_TEMP/sunder-runtime-final-verified-$RID.json"
          mkdir -p "$final"
          cp "${first_archives[@]}" "$final/"
          mkdir -p "$(dirname "$final_receipt")"
          cp "$first_receipt" "$final_receipt"
          dotnet run --project languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/Sunder.ExecutionRuntime.Build.csproj \
            --configuration Release --no-restore -- validate-native-output \
            --lock "$PRODUCTION_LOCK" --kind production --rid "$RID" --directory "$final" \
            --release-public-keys "$SUNDER_EXECUTION_RUNTIME_RELEASE_PUBLIC_KEYS" \
            --attestation-public-keys "$SUNDER_EXECUTION_RUNTIME_ATTESTATION_PUBLIC_KEYS" \
            --release-driver-sha256 "$SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256" \
            --receipt "$verified_final_receipt"
          cmp "$final_receipt" "$verified_final_receipt"

      - name: Upload signed native runtime candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-execution-runtimes-${{ matrix.rid }}-${{ github.run_attempt }}
          path: |
            artifacts/execution-runtimes/${{ matrix.rid }}/*.sunderruntime
            artifacts/execution-runtime-receipts/${{ matrix.rid }}.json
          if-no-files-found: error
          retention-days: 1

  release-fan-in:
    name: Validate exact all-six-RID release transaction
    needs: native-build
    runs-on: ${{ vars.SUNDER_EXECUTION_RUNTIME_COORDINATOR_RUNNER }}
    timeout-minutes: 90
    environment: sunder-execution-runtime-native-release
    permissions:
      actions: read
      contents: read
    env:
      SUNDER_EXECUTION_RUNTIME_RELEASE_PUBLIC_KEYS: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_PUBLIC_KEYS }}
      SUNDER_EXECUTION_RUNTIME_ATTESTATION_PUBLIC_KEYS: ${{ vars.SUNDER_EXECUTION_RUNTIME_ATTESTATION_PUBLIC_KEYS }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_ARM64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_X64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_X64 }}
      SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_ARM64: ${{ vars.SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_ARM64 }}
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore release-set validator
        run: dotnet restore languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/Sunder.ExecutionRuntime.Build.csproj --locked-mode

      - name: Download all six native lane outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-execution-runtimes-*-${{ github.run_attempt }}
          path: fan-in
          merge-multiple: true

      - name: Independently reverify the complete immutable release set
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg win_x64 "$SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_X64" \
            --arg win_arm64 "$SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_WIN_ARM64" \
            --arg linux_x64 "$SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_X64" \
            --arg linux_arm64 "$SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_LINUX_ARM64" \
            --arg osx_x64 "$SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_X64" \
            --arg osx_arm64 "$SUNDER_EXECUTION_RUNTIME_RELEASE_DRIVER_SHA256_OSX_ARM64" '
              {
                schemaVersion:1,
                kind:"https://sunderapp.io/acceptance/runtime-release-drivers/v1",
                drivers:[
                  {rid:"win-x64",sha256:$win_x64},
                  {rid:"win-arm64",sha256:$win_arm64},
                  {rid:"linux-x64",sha256:$linux_x64},
                  {rid:"linux-arm64",sha256:$linux_arm64},
                  {rid:"osx-x64",sha256:$osx_x64},
                  {rid:"osx-arm64",sha256:$osx_arm64}
                ]
              }
            ' > fan-in/release-drivers.v1.json
          dotnet run --project languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/Sunder.ExecutionRuntime.Build.csproj \
            --configuration Release --no-restore -- validate-release-set \
            --lock "$PRODUCTION_LOCK" --kind production \
            --directory fan-in/execution-runtimes \
            --native-receipts fan-in/execution-runtime-receipts \
            --release-drivers fan-in/release-drivers.v1.json \
            --release-public-keys "$SUNDER_EXECUTION_RUNTIME_RELEASE_PUBLIC_KEYS" \
            --attestation-public-keys "$SUNDER_EXECUTION_RUNTIME_ATTESTATION_PUBLIC_KEYS" \
            --receipt fan-in/release-set.v1.json
          cp "$PRODUCTION_LOCK" fan-in/production.lock.json

      - name: Retain the exact source-built verifier for no-rebuild publication
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/Sunder.ExecutionRuntime.Build.csproj \
            -c Release --no-restore --self-contained false -p:UseAppHost=false -o "$RUNNER_TEMP/runtime-verifier"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import zipfile
          root = Path(os.environ['RUNNER_TEMP']) / 'runtime-verifier'
          with zipfile.ZipFile('fan-in/runtime-verifier.zip', 'x', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      if path.is_symlink():
                          raise ValueError('Verifier contains a link')
                      archive.write(path, path.relative_to(root).as_posix())
          PY

      - name: Upload centralized release-set evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-execution-runtime-release-set-${{ github.run_id }}-${{ github.run_attempt }}
          path: fan-in/
          if-no-files-found: error
          retention-days: 1

  archive-release-evidence:
    name: Persist immutable numeric-release evidence
    needs: [approval-gate, release-fan-in]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: sunder-execution-runtime-native-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout the exact release workflow source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the exact centrally verified native handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-execution-runtime-release-set-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-input

      - name: Retain the exact archives, receipts, lock, drivers and verifier
        shell: bash
        env:
          RELEASE_ID: ${{ needs.approval-gate.outputs.release_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/execution-runtimes/retained_native.py upload \
            --release-id "$RELEASE_ID" --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" \
            --sdk-tag "$SUNDER_CORE_SDK_TAG" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --lock-sha256 "$SUNDER_EXECUTION_RUNTIME_LOCK_SHA256" --directory evidence-input
