name: Sunder Core CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sunder-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.100"
  NODE_VERSION: "24.18.1"

jobs:
  build-test-pack:
    name: Build, test, and inspect V1 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      npm_version: ${{ steps.sdk-metadata.outputs.npm_version }}
      npm_version_range: ${{ steps.sdk-metadata.outputs.npm_version_range }}
      sdk_version: ${{ steps.sdk-metadata.outputs.version }}
      sdk_version_range: ${{ steps.sdk-metadata.outputs.version_range }}
      vite_version: ${{ steps.sdk-metadata.outputs.vite_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json

      - name: Read and verify coordinated package metadata
        id: sdk-metadata
        run: node scripts/release/check-sdk-version.mjs

      - name: Install exact packageManager npm
        env:
          NPM_VERSION: ${{ steps.sdk-metadata.outputs.npm_version }}
        run: |
          npm install --global "npm@$NPM_VERSION" --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "$NPM_VERSION" ]]

      - name: Install Node dependencies
        run: npm ci --prefix languages/typescript/node

      - name: Check Markdown links and anchors
        run: python3 scripts/release/check-markdown-links.py .

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run release verification fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/release/test_verify_nuget_package_set.py
          bash scripts/release/verify-nuget-source.fixture.sh
          bash scripts/release/preflight-npm-trusted-publishing.fixture.sh
          bash scripts/release/verify-github-release-assets.fixture.sh
          bash scripts/release/verify-release-tag.fixture.sh
          bash scripts/release/verify-nuget-package.fixture.sh

      - name: Restore
        run: dotnet restore Sunder.Core.slnx --locked-mode

      - name: Build forced Release
        run: dotnet build Sunder.Core.slnx -c Release --no-restore --no-incremental -m:1 -p:GeneratePackageOnBuild=false

      - name: Require OS-neutral .NET lane
        run: node scripts/test-oracles/run-core-test-lane.mjs --primary-lane dotnet-linux

      - name: Test OS-neutral .NET behavior once
        run: >-
          node scripts/test-oracles/run-dotnet-tests-with-results.mjs
          --primary-lane dotnet-linux
          --results-directory artifacts/test-results/dotnet-linux
          --configuration Release

      - name: Summarize OS-neutral .NET results
        if: always()
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results/dotnet-linux
          --allow-partial
          --require-primary-lane dotnet-linux

      - name: Upload OS-neutral .NET results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-core-dotnet-linux-results
          path: artifacts/test-results/dotnet-linux
          if-no-files-found: warn
          retention-days: 14

      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          dotnet languages/csharp/dotnet/host/Sunder.Cli/bin/Release/net10.0/sunder.dll --help >/dev/null
          dotnet languages/csharp/dotnet/host/Sunder.Cli/bin/Release/net10.0/sunder.dll --help --json | grep -q '"exitCode":0'

      - name: Verify compatibility candidate
        run: node scripts/compatibility/generate-core-compatibility-candidate.mjs --check

      - name: Pack coordinated V1 packages
        shell: bash
        env:
          SDK_VERSION: ${{ steps.sdk-metadata.outputs.version }}
          SDK_VERSION_RANGE: ${{ steps.sdk-metadata.outputs.version_range }}
        run: |
          set -euo pipefail
          output="$PWD/artifacts/sdk"
          mkdir -p "$output"
          projects=(
            languages/csharp/dotnet/packages/Sunder.Sdk/Sunder.Sdk.csproj
            languages/csharp/dotnet/packages/Sunder.Sdk.Avalonia/Sunder.Sdk.Avalonia.csproj
            languages/csharp/dotnet/packages/Sunder.Sdk.Stacks/Sunder.Sdk.Stacks.csproj
            languages/csharp/dotnet/packages/Sunder.Sdk.Worker/Sunder.Sdk.Worker.csproj
            languages/csharp/dotnet/packages/Sunder.Package.Build/Sunder.Package.Build.csproj
            languages/csharp/dotnet/packages/Sunder.Package.Templates/Sunder.Package.Templates.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "$project" -c Release --no-restore --no-build -o "$output" -p:GeneratePackageOnBuild=false
          done

          expected=(
            "Sunder.Sdk.$SDK_VERSION.nupkg"
            "Sunder.Sdk.Avalonia.$SDK_VERSION.nupkg"
            "Sunder.Sdk.Stacks.$SDK_VERSION.nupkg"
            "Sunder.Sdk.Worker.$SDK_VERSION.nupkg"
            "Sunder.Package.Build.$SDK_VERSION.nupkg"
            "Sunder.Package.Templates.$SDK_VERSION.nupkg"
          )
          test "$(find "$output" -maxdepth 1 -name '*.nupkg' -type f | wc -l)" -eq 6
          for package in "${expected[@]}"; do
            test -f "$output/$package"
          done
          python3 scripts/release/verify-nuget-package-set.py "$SDK_VERSION" "$output" "$GITHUB_SHA"

          for package in Sunder.Sdk.Avalonia Sunder.Sdk.Stacks; do
            nuspec="$(unzip -p "$output/$package.$SDK_VERSION.nupkg" '*.nuspec')"
            sdk_version_range_with_space="${SDK_VERSION_RANGE/,/, }"
            if [[ "$nuspec" != *"id=\"Sunder.Sdk\" version=\"$SDK_VERSION_RANGE\""* \
                && "$nuspec" != *"id=\"Sunder.Sdk\" version=\"$sdk_version_range_with_space\""* ]]; then
              echo "$package does not bound its Sunder.Sdk dependency to '$SDK_VERSION_RANGE'." >&2
              exit 1
            fi
          done

          worker_nuspec="$(unzip -p "$output/Sunder.Sdk.Worker.$SDK_VERSION.nupkg" '*.nuspec')"
          if [[ "$worker_nuspec" != *"id=\"Sunder.Sdk\" version=\"[$SDK_VERSION]\""* ]]; then
            echo "Sunder.Sdk.Worker must depend on the exact coordinated Sunder.Sdk version '[$SDK_VERSION]'." >&2
            exit 1
          fi

          build_entries="$(unzip -Z1 "$output/Sunder.Package.Build.$SDK_VERSION.nupkg")"
          test "$(printf '%s\n' "$build_entries" | grep -c '^buildTransitive/Sunder.Package.Build.targets$')" -eq 1
          test "$(printf '%s\n' "$build_entries" | grep -c '^tasks/net10.0/.*\.dll$')" -eq 5
          if printf '%s\n' "$build_entries" | grep -Eq '^(lib|ref|runtimes)/'; then
            echo "Sunder.Package.Build leaked a consumer compile/runtime asset." >&2
            exit 1
          fi

      - name: Upload local V1 feed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-sdk-v1-feed
          path: |
            artifacts/sdk/Sunder.Sdk.${{ steps.sdk-metadata.outputs.version }}.nupkg
            artifacts/sdk/Sunder.Sdk.Avalonia.${{ steps.sdk-metadata.outputs.version }}.nupkg
            artifacts/sdk/Sunder.Sdk.Stacks.${{ steps.sdk-metadata.outputs.version }}.nupkg
            artifacts/sdk/Sunder.Sdk.Worker.${{ steps.sdk-metadata.outputs.version }}.nupkg
            artifacts/sdk/Sunder.Package.Build.${{ steps.sdk-metadata.outputs.version }}.nupkg
            artifacts/sdk/Sunder.Package.Templates.${{ steps.sdk-metadata.outputs.version }}.nupkg
          if-no-files-found: error

  template-smoke:
    name: Template smoke (${{ matrix.variant }})
    needs: build-test-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: headless
            arguments: ""
          - variant: avalonia
            arguments: "--withAvalonia"
          - variant: stacks
            arguments: "--withStacks"
          - variant: all
            arguments: "--withAvalonia --withStacks"
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download local V1 feed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-sdk-v1-feed
          path: local-feed

      - name: Generate, restore, build, and pack
        shell: bash
        env:
          SDK_VERSION: ${{ needs.build-test-pack.outputs.sdk_version }}
          SDK_VERSION_RANGE: ${{ needs.build-test-pack.outputs.sdk_version_range }}
        run: |
          set -euo pipefail
          dotnet new install "$PWD/local-feed/Sunder.Package.Templates.$SDK_VERSION.nupkg"
          sample="$RUNNER_TEMP/sunder-template-${{ matrix.variant }}"
          dotnet new sunder-package \
            --name "Smoke.${{ matrix.variant }}" \
            --packageId "smoke.${{ matrix.variant }}" \
            --packageName "Smoke ${{ matrix.variant }}" \
            --output "$sample" \
            ${{ matrix.arguments }}

          project="$(find "$sample" -name "Smoke.${{ matrix.variant }}.csproj" -print -quit)"
          if [[ -z "$project" ]]; then
            echo "Generated template project was not found under '$sample'." >&2
            exit 1
          fi
          sunder_references="$(find "$sample" -type f \( -name '*.csproj' -o -name '*.props' \) -exec grep -Eh 'PackageReference Include="(Sunder\.Sdk(\.Avalonia|\.Stacks)?|Sunder\.Package\.Build)"' {} + || true)"
          if [[ -z "$sunder_references" ]]; then
            echo "Generated template did not contain Sunder package references." >&2
            exit 1
          fi
          invalid_references="$(printf '%s\n' "$sunder_references" | grep -Fv "Version=\"$SDK_VERSION_RANGE\"" || true)"
          if [[ -n "$invalid_references" ]]; then
            echo "Generated template contained a Sunder reference outside coordinated range '$SDK_VERSION_RANGE':" >&2
            printf '%s\n' "$invalid_references" >&2
            exit 1
          fi

          dotnet restore "$project" \
            --source "$PWD/local-feed" \
            --source https://api.nuget.org/v3/index.json
          dotnet build "$project" -c Release --no-restore --no-incremental
          dotnet msbuild "$project" -t:PackSunderPackage -p:Configuration=Release

          mapfile -t archives < <(find "$sample/bin/Release" -name '*.sunderpkg' -type f)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one generated package archive, found ${#archives[@]}." >&2
            exit 1
          fi
          unzip -t "${archives[0]}"

  template-runtime-host-smoke:
    name: Generated .NET template signed Runtime Host smoke
    needs: build-test-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget/template-runtime-host
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup Node for result evidence
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download local V1 feed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-sdk-v1-feed
          path: local-feed
      - name: Generate and build the development package
        id: generated-template
        shell: bash
        env:
          SDK_VERSION: ${{ needs.build-test-pack.outputs.sdk_version }}
        run: |
          set -euo pipefail
          sample="$RUNNER_TEMP/sunder-dotnet-template-host-smoke"
          dotnet new install "$PWD/local-feed/Sunder.Package.Templates.$SDK_VERSION.nupkg"
          dotnet new sunder-package \
            --name Smoke.RuntimeHost \
            --packageId smoke.runtimehost \
            --packageName "Smoke Runtime Host" \
            --output "$sample"
          project="$sample/Smoke.RuntimeHost.csproj"
          test -f "$project"
          dotnet restore "$project" \
            --source "$PWD/local-feed" \
            --source https://api.nuget.org/v3/index.json
          dotnet build "$project" --configuration Release --no-restore --no-incremental
          dev_package="$sample/bin/Release/net10.0/linux-x64/sunder-dev"
          test -f "$dev_package/manifest/sunder-package.json"
          echo "dev_package=$dev_package" >> "$GITHUB_OUTPUT"
      - name: Restore Runtime Host acceptance tests
        run: dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode
      - name: Require generated template activation through the signed Runtime Host
        env:
          SUNDER_REQUIRE_DOTNET_TEMPLATE_HOST_SMOKE: "1"
          SUNDER_DOTNET_TEMPLATE_DEV_PATH: ${{ steps.generated-template.outputs.dev_package }}
        run: >-
          dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj
          --configuration Release
          --no-restore
          -m:1
          -p:GeneratePackageOnBuild=false
          --filter FullyQualifiedName=Sunder.Runtime.Host.Tests.GeneratedTemplateRuntimeHostSmokeTests.GeneratedDotNetTemplate_ActivatesThroughSignedRuntimeHost
          --logger "trx;LogFileName=Sunder.Runtime.Host.Tests.trx"
          --results-directory artifacts/test-results/dotnet-template-runtime-host
      - name: Summarize required generated-template result
        if: always()
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results/dotnet-template-runtime-host
          --allow-partial
          --require-test Sunder.Runtime.Host.Tests.GeneratedTemplateRuntimeHostSmokeTests.GeneratedDotNetTemplate_ActivatesThroughSignedRuntimeHost
      - name: Upload required generated-template result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-dotnet-template-runtime-host-results
          path: artifacts/test-results/dotnet-template-runtime-host
          if-no-files-found: warn
          retention-days: 14
