name: Sunder CLI Release

on:
  push:
    tags:
      - "cli/v*"

permissions: {}

concurrency:
  group: sunder-cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.100"

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^cli/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]]; then
            echo "CLI release tags must use SemVer format, for example cli/v0.1.0 or cli/v0.1.0-beta.1." >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          is_prerelease="false"
          if [[ "$version" == *-* ]]; then
            is_prerelease="true"
            prerelease="${version#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0* && "$identifier" != "0" ]]; then
                echo "Numeric SemVer prerelease identifiers must not contain leading zeroes." >&2
                exit 1
              fi
            done
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.runtime }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-24.04
          - runtime: linux-arm64
            os: ubuntu-24.04-arm
          - runtime: osx-x64
            os: macos-14
          - runtime: osx-arm64
            os: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ needs.prepare.outputs.version }}"
          $runtime = "${{ matrix.runtime }}"
          $projectPath = "src/Host/Sunder.Cli/Sunder.Cli.csproj"
          $publishDir = "artifacts/publish/cli/$runtime"
          $assetDir = "artifacts/release/cli/$runtime"

          dotnet restore $projectPath -r $runtime -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish $projectPath `
            -c Release `
            -r $runtime `
            --no-restore `
            --self-contained true `
            -p:Version=$version `
            -p:InformationalVersion=$version `
            -p:ContinuousIntegrationBuild=true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not $IsWindows) {
            $executablePath = Join-Path $publishDir "sunder"
            if (Test-Path -LiteralPath $executablePath) {
              chmod +x $executablePath
            }
          }

          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          if ($IsWindows) {
            $assetPath = Join-Path $assetDir "sunder-cli-$version-$runtime.zip"
            if (Test-Path -LiteralPath $assetPath) { Remove-Item -LiteralPath $assetPath -Force }
            Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $assetPath
          } else {
            $assetPath = Join-Path $assetDir "sunder-cli-$version-$runtime.tar.gz"
            if (Test-Path -LiteralPath $assetPath) { Remove-Item -LiteralPath $assetPath -Force }
            tar -czf $assetPath -C $publishDir .
          }

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunder-cli-${{ matrix.runtime }}
          path: artifacts/release/cli/${{ matrix.runtime }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag="cli/v$VERSION"
          expected_archive_names=(
            "sunder-cli-$VERSION-win-x64.zip"
            "sunder-cli-$VERSION-win-arm64.zip"
            "sunder-cli-$VERSION-linux-x64.tar.gz"
            "sunder-cli-$VERSION-linux-arm64.tar.gz"
            "sunder-cli-$VERSION-osx-x64.tar.gz"
            "sunder-cli-$VERSION-osx-arm64.tar.gz"
          )
          expected_archive_paths=(
            "release-assets/sunder-cli-win-x64/${expected_archive_names[0]}"
            "release-assets/sunder-cli-win-arm64/${expected_archive_names[1]}"
            "release-assets/sunder-cli-linux-x64/${expected_archive_names[2]}"
            "release-assets/sunder-cli-linux-arm64/${expected_archive_names[3]}"
            "release-assets/sunder-cli-osx-x64/${expected_archive_names[4]}"
            "release-assets/sunder-cli-osx-arm64/${expected_archive_names[5]}"
          )
          binaries=(release-assets/sunder-cli-*/*)
          if [[ ${#binaries[@]} -ne ${#expected_archive_names[@]} ]]; then
            echo "Expected exactly ${#expected_archive_names[@]} CLI release archives, found ${#binaries[@]}." >&2
            exit 1
          fi
          for asset in "${expected_archive_paths[@]}"; do
            test -f "$asset" || { echo "Missing exact CLI release archive: $asset" >&2; exit 1; }
          done

          bash scripts/release/generate-release-evidence.sh release-assets "sunder-core=$GITHUB_SHA"
          mapfile -t assets < <(find release-assets -type f | sort)
          expected_remote_names=(
            "${expected_archive_names[@]}"
            SHA256SUMS
            release-provenance.json
            release-sbom.spdx.json
            toolchain.txt
          )
          if [[ ${#assets[@]} -ne ${#expected_remote_names[@]} ]]; then
            echo "Expected exactly ${#expected_remote_names[@]} CLI release assets after evidence generation, found ${#assets[@]}." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release '$tag' already exists; immutable release assets cannot be overwritten." >&2
              exit 1
            fi
            gh release delete "$tag" --yes
          fi

          create_args=(
            release create "$tag"
            --title "Sunder CLI $VERSION"
            --notes "Automated Sunder CLI release for $VERSION."
            --latest=false
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          gh "${create_args[@]}" --draft
          cleanup_failed_draft() {
            exit_code=$?
            if [[ $exit_code -ne 0 ]] && gh release view "$tag" >/dev/null 2>&1; then
              if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == "true" ]]; then
                gh release delete "$tag" --yes || true
              fi
            fi
            exit "$exit_code"
          }
          trap cleanup_failed_draft EXIT
          gh release upload "$tag" "${assets[@]}"

          release_json="$(gh release view "$tag" --json isDraft,assets)"
          [[ "$(jq -r '.isDraft' <<< "$release_json")" == "true" ]] \
            || { echo "CLI release '$tag' must remain a draft until its assets are verified." >&2; exit 1; }
          remote_asset_count="$(jq '.assets | length' <<< "$release_json")"
          if [[ "$remote_asset_count" != "${#expected_remote_names[@]}" ]]; then
            echo "Draft CLI release must contain exactly ${#expected_remote_names[@]} assets, found $remote_asset_count." >&2
            exit 1
          fi
          remote_asset_names="$(jq -r '.assets[].name' <<< "$release_json")"
          for expected_name in "${expected_remote_names[@]}"; do
            asset_count="$(printf '%s\n' "$remote_asset_names" | grep -Fxc "$expected_name" || true)"
            if [[ "$asset_count" != "1" ]]; then
              echo "Draft CLI release must contain exactly one '$expected_name'; found $asset_count." >&2
              exit 1
            fi
          done

          gh release edit "$tag" --draft=false
          trap - EXIT
