name: Sunder CLI Release

on:
  push:
    tags: ["cli/v*"]

permissions: {}
concurrency:
  group: sunder-release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  DOTNET_VERSION: "10.0.100"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: release
        run: python3 -B scripts/release/github_release.py metadata "$GITHUB_REF_NAME"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore languages/csharp/dotnet/tests/Sunder.Cli.Tests/Sunder.Cli.Tests.csproj --locked-mode
      - run: dotnet test languages/csharp/dotnet/tests/Sunder.Cli.Tests/Sunder.Cli.Tests.csproj -c Release --no-restore --logger trx

  package:
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, os: windows-2022}
          - {rid: win-arm64, os: windows-11-arm}
          - {rid: linux-x64, os: ubuntu-24.04}
          - {rid: linux-arm64, os: ubuntu-24.04-arm}
          - {rid: osx-x64, os: macos-15-intel}
          - {rid: osx-arm64, os: macos-15}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish and smoke the actual CLI
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = "Stop"
          $project = "languages/csharp/dotnet/host/Sunder.Cli/Sunder.Cli.csproj"
          $output = "artifacts/publish/cli/$env:RID"
          dotnet restore $project -r $env:RID -p:Configuration=Release -p:RestoreLockedMode=false "-p:NuGetLockFilePath=obj/packages.$env:RID.lock.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish $project -c Release -r $env:RID --no-restore --self-contained true `
            -p:Version=$env:VERSION -p:InformationalVersion=$env:VERSION `
            -p:IncludeSourceRevisionInInformationalVersion=false -p:ContinuousIntegrationBuild=true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false -p:RestoreLockedMode=false `
            "-p:NuGetLockFilePath=obj/packages.$env:RID.lock.json" -o $output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $binary = Join-Path $output $(if ($IsWindows) { "sunder.exe" } else { "sunder" })
          if (-not $IsWindows) { chmod +x $binary }
          $result = (& $binary version --json | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -or $result.exitCode -ne 0 -or $result.data.version -ne $env:VERSION) { throw "CLI version smoke failed" }
          $help = (& $binary --help | Out-String)
          if ($LASTEXITCODE -or [string]::IsNullOrWhiteSpace($help)) { throw "CLI help smoke failed" }
          $helpJson = (& $binary --help --json | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -or $helpJson.schemaVersion -ne 1 -or -not $helpJson.success) { throw "CLI JSON help smoke failed" }
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          if ($IsWindows) {
            Compress-Archive -Path "$output/*" -DestinationPath "artifacts/release/sunder-cli-$env:VERSION-$env:RID.zip"
          } else {
            tar -czf "artifacts/release/sunder-cli-$env:VERSION-$env:RID.tar.gz" -C $output .
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-cli-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sunder-github-release-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-cli-*
          path: release-assets
      - name: Publish verified immutable CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -B scripts/release/github_release.py stage "$GITHUB_REF_NAME" --directory release-assets
          python3 -B scripts/release/github_release.py finalize "$GITHUB_REF_NAME" --directory release-assets
