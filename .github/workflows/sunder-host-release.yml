name: Sunder Runtime Host Release

on:
  push:
    tags: ["host/v*"]

permissions: {}
concurrency:
  group: sunder-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/sunder-ci.yml
    with:
      scope: host
    permissions:
      contents: read

  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.platforms.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: release
        run: python3 -B scripts/release/github_release.py metadata "$GITHUB_REF_NAME"
      - id: platforms
        run: python3 -B scripts/ci/metadata.py matrices

  package:
    needs: [prepare, validation]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Publish Supervisor and nested Runtime
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        run: ./scripts/release/package-component.ps1 -Component host -Version $env:VERSION -Rid $env:RID
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-runtime-host-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sunder-github-release-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-runtime-host-*
          path: release-assets
      - name: Publish verified immutable Host assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -B scripts/release/github_release.py stage "$GITHUB_REF_NAME" --directory release-assets
          python3 -B scripts/release/github_release.py finalize "$GITHUB_REF_NAME" --directory release-assets
