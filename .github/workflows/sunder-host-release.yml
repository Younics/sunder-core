name: Sunder Runtime Host Release

on:
  push:
    tags: ["host/v*"]

permissions: {}
concurrency:
  group: sunder-release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  DOTNET_VERSION: "10.0.403"

jobs:
  validation:
    uses: ./.github/workflows/sunder-host-validation.yml
    permissions:
      contents: read

  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: release
        run: python3 -B scripts/release/github_release.py metadata "$GITHUB_REF_NAME"

  package:
    needs: [prepare, validation]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, os: windows-2022}
          - {rid: win-arm64, os: windows-11-arm}
          - {rid: linux-x64, os: ubuntu-24.04}
          - {rid: linux-arm64, os: ubuntu-24.04-arm}
          - {rid: osx-x64, os: macos-15-intel}
          - {rid: osx-arm64, os: macos-15}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish Supervisor and nested Runtime
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = "Stop"
          $project = "languages/csharp/dotnet/host/Sunder.Host.Supervisor/Sunder.Host.Supervisor.csproj"
          $output = "artifacts/publish/host/$env:RID"
          dotnet restore $project -r $env:RID -p:Configuration=Release -p:RestoreLockedMode=false "-p:NuGetLockFilePath=obj/packages.$env:RID.lock.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish $project -c Release -r $env:RID --no-restore --self-contained true `
            -p:Version=$env:VERSION -p:InformationalVersion=$env:VERSION `
            -p:IncludeSourceRevisionInInformationalVersion=false -p:ContinuousIntegrationBuild=true `
            -p:PublishSingleFile=false -p:RestoreLockedMode=false "-p:NuGetLockFilePath=obj/packages.$env:RID.lock.json" -o $output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          foreach ($file in @("Sunder.Host.Supervisor$suffix", "RuntimeHost/Sunder.Runtime.Host$suffix")) {
            if (-not (Test-Path -LiteralPath (Join-Path $output $file) -PathType Leaf)) { throw "Missing Host payload: $file" }
          }
          python3 scripts/test/release/smoke-host.py $output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          if ($IsWindows) {
            Compress-Archive -Path "$output/*" -DestinationPath "artifacts/release/sunder-runtime-host-$env:VERSION-$env:RID.zip"
          } else {
            tar -czf "artifacts/release/sunder-runtime-host-$env:VERSION-$env:RID.tar.gz" -C $output .
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-runtime-host-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sunder-github-release-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-runtime-host-*
          path: release-assets
      - name: Publish verified immutable Host assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -B scripts/release/github_release.py stage "$GITHUB_REF_NAME" --directory release-assets
          python3 -B scripts/release/github_release.py finalize "$GITHUB_REF_NAME" --directory release-assets
