name: Sunder Runtime Host Release

on:
  push:
    tags:
      - "host/v*"

permissions: {}

concurrency:
  group: sunder-host-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.100"

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^host/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]]; then
            echo "Runtime Host release tags must use SemVer format, for example host/v0.1.0 or host/v0.1.0-beta.1." >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          is_prerelease="false"
          if [[ "$version" == *-* ]]; then
            is_prerelease="true"
            prerelease="${version#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0* && "$identifier" != "0" ]]; then
                echo "Numeric SemVer prerelease identifiers must not contain leading zeroes." >&2
                exit 1
              fi
            done
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.runtime }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-24.04
          - runtime: linux-arm64
            os: ubuntu-24.04-arm
          - runtime: osx-x64
            os: macos-14
          - runtime: osx-arm64
            os: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Host Supervisor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ needs.prepare.outputs.version }}"
          $runtime = "${{ matrix.runtime }}"
          $projectPath = "src/Host/Sunder.Host.Supervisor/Sunder.Host.Supervisor.csproj"
          $publishDir = "artifacts/publish/host/$runtime"
          $assetDir = "artifacts/release/host/$runtime"

          dotnet restore $projectPath -r $runtime -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish $projectPath `
            -c Release `
            -r $runtime `
            --no-restore `
            --self-contained true `
            -p:Version=$version `
            -p:InformationalVersion=$version `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:ContinuousIntegrationBuild=true `
            -p:PublishSingleFile=false `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not $IsWindows) {
            $executablePath = Join-Path $publishDir "Sunder.Host.Supervisor"
            if (Test-Path -LiteralPath $executablePath) {
              chmod +x $executablePath
            }
          }

          $executableSuffix = if ($IsWindows) { ".exe" } else { "" }
          $requiredFiles = @(
            (Join-Path $publishDir "Sunder.Host.Supervisor$executableSuffix"),
            (Join-Path $publishDir "RuntimeHost/Sunder.Runtime.Host$executableSuffix")
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "The standalone Host archive is missing '$requiredFile'."
            }
          }

          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          if ($IsWindows) {
            $assetPath = Join-Path $assetDir "sunder-runtime-host-$version-$runtime.zip"
            if (Test-Path -LiteralPath $assetPath) { Remove-Item -LiteralPath $assetPath -Force }
            Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $assetPath
          } else {
            $assetPath = Join-Path $assetDir "sunder-runtime-host-$version-$runtime.tar.gz"
            if (Test-Path -LiteralPath $assetPath) { Remove-Item -LiteralPath $assetPath -Force }
            tar -czf $assetPath -C $publishDir .
          }

      - name: Upload Runtime Host artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunder-runtime-host-${{ matrix.runtime }}
          path: artifacts/release/host/${{ matrix.runtime }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Runtime Host artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag="host/v$VERSION"
          binaries=(release-assets/sunder-runtime-host-*/*)
          if [[ ${#binaries[@]} -eq 0 ]]; then
            echo "No Runtime Host release assets were downloaded." >&2
            exit 1
          fi

          bash scripts/release/generate-release-evidence.sh release-assets "sunder-core=$GITHUB_SHA"
          mapfile -t assets < <(find release-assets -type f | sort)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists; immutable release assets cannot be overwritten." >&2
            exit 1
          fi

          create_args=(
            release create "$tag"
            --title "Sunder Runtime Host $VERSION"
            --notes "Automated Sunder Runtime Host release for $VERSION."
            --latest=false
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          gh "${create_args[@]}" "${assets[@]}"
