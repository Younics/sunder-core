name: Sunder SDK Release

on:
  push:
    tags: ["sdk/v*"]

permissions: {}
concurrency:
  group: sunder-release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  DOTNET_VERSION: "10.0.100"
  NODE_VERSION: "24.18.1"
  NPM_VERSION: "11.19.0"
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: sunder-core-release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: release
        run: python3 -B scripts/release/github_release.py metadata "$GITHUB_REF_NAME"
      - name: Verify tag source and coordinated metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SUNDER_CORE_RELEASE_APPROVED: ${{ vars.SUNDER_CORE_RELEASE_APPROVED }}
          SUNDER_CORE_RELEASE_APPROVAL_REFERENCE: ${{ vars.SUNDER_CORE_RELEASE_APPROVAL_REFERENCE }}
          SUNDER_CORE_ARTIFACT_SOURCE_COMMIT: ${{ vars.SUNDER_CORE_ARTIFACT_SOURCE_COMMIT }}
          SUNDER_CORE_REGISTRY_ORIGIN: ${{ vars.SUNDER_CORE_REGISTRY_ORIGIN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 -B scripts/release/release_coordinates.py sdk
          node scripts/release/check-sdk-version.mjs "$VERSION"
          bash scripts/release/verify-nuget-source.sh

  validation:
    needs: prepare
    uses: ./.github/workflows/sunder-ci.yml
    permissions:
      contents: read

  compatibility-corpus:
    name: SDK retained corpus (${{ matrix.lane }})
    needs: [prepare, validation]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: portable, os: ubuntu-24.04}
          - {lane: win-x64, os: windows-2022}
          - {lane: win-arm64, os: windows-11-arm}
          - {lane: linux-x64, os: ubuntu-24.04}
          - {lane: linux-arm64, os: ubuntu-24.04-arm}
          - {lane: osx-x64, os: macos-15-intel}
          - {lane: osx-arm64, os: macos-15}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-tested-sdk
          path: candidate
      - name: Execute reviewed corpus with measured native context and byte-bound inputs
        env:
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
          CORPUS_LANE: ${{ matrix.lane }}
        shell: bash
        run: >-
          python3 -B scripts/compatibility/sdk_compatibility_execution.py collect
          --candidate candidate --version "$SDK_VERSION" --lane "$CORPUS_LANE"
          --output "$RUNNER_TEMP/sdk-compatibility-lane"
      - name: Retain independently collected owning-lane evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-sdk-compatibility-lane-${{ matrix.lane }}
          path: ${{ runner.temp }}/sdk-compatibility-lane
          if-no-files-found: error

  stage:
    needs: [prepare, validation, compatibility-corpus]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: sunder-core-release
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.publication.outputs.release_id }}
      compatibility_sha256: ${{ steps.qualification.outputs.compatibility_sha256 }}
      compatibility_base_commit: ${{ steps.qualification.outputs.compatibility_base_commit }}
      compatibility_base_sha256: ${{ steps.qualification.outputs.compatibility_base_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUNDER_CORE_RELEASE_APPROVED: ${{ vars.SUNDER_CORE_RELEASE_APPROVED }}
      SUNDER_CORE_RELEASE_APPROVAL_REFERENCE: ${{ vars.SUNDER_CORE_RELEASE_APPROVAL_REFERENCE }}
      SUNDER_CORE_ARTIFACT_SOURCE_COMMIT: ${{ vars.SUNDER_CORE_ARTIFACT_SOURCE_COMMIT }}
      SUNDER_CORE_REGISTRY_ORIGIN: ${{ vars.SUNDER_CORE_REGISTRY_ORIGIN }}
      SUNDER_SDK_COMPATIBILITY_BASE_COMMIT: ${{ vars.SUNDER_SDK_COMPATIBILITY_BASE_COMMIT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Export source-bound canonical catalog
        if: needs.prepare.outputs.is_prerelease == 'false'
        run: |
          dotnet restore languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/Sunder.ExecutionRuntime.Build.csproj --locked-mode
          dotnet build languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/Sunder.ExecutionRuntime.Build.csproj -c Release --no-restore
          python3 -B scripts/release/core_catalog_release.py export --tool languages/csharp/dotnet/tools/Sunder.ExecutionRuntime.Build/bin/Release/net10.0/Sunder.ExecutionRuntime.Build.dll --directory "$RUNNER_TEMP/catalog"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-tested-sdk
          path: candidate
      - name: Download same-run owning-lane outputs separately from candidate inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-sdk-compatibility-lane-*
          path: compatibility-executions
          merge-multiple: false
      - name: Assemble the tested bytes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --registry="$NPM_REGISTRY"
          mkdir release-assets
          cp candidate/sdk/*.nupkg candidate/npm/*.tgz release-assets/
          python3 scripts/release/verify-nuget-package-set.py "$VERSION" release-assets "$GITHUB_SHA"
          node scripts/release/generate-node-release-notices.mjs languages/typescript/node/package-lock.json release-assets
      - name: Require release-specific compatibility and retain the new candidate reference
        id: qualification
        run: python3 -B scripts/compatibility/sdk_release_compatibility.py prepare --candidate candidate --directory release-assets --executions compatibility-executions
      - name: Retain the numeric catalog receipt
        if: needs.prepare.outputs.is_prerelease == 'false'
        run: |
          set -euo pipefail
          release_id="$(python3 -B scripts/release/github_release.py create "$GITHUB_REF_NAME" | jq -er .id)"
          python3 -B scripts/release/core_catalog_release.py retain --directory "$RUNNER_TEMP/catalog" --release-id "$release_id"
          cp "$RUNNER_TEMP/catalog/sunder-platform-contracts.v1.json" "$RUNNER_TEMP/catalog/sunder-platform-contracts.receipt.v1.json" release-assets/
      - name: Stage and read back immutable release assets
        id: publication
        env:
          SUNDER_SDK_COMPATIBILITY_SHA256: ${{ steps.qualification.outputs.compatibility_sha256 }}
          SUNDER_SDK_COMPATIBILITY_BASE_SHA256: ${{ steps.qualification.outputs.compatibility_base_sha256 }}
        run: python3 -B scripts/release/github_release.py stage "$GITHUB_REF_NAME" --directory release-assets

  publish-npm:
    needs: [prepare, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUNDER_SDK_COMPATIBILITY_SHA256: ${{ needs.stage.outputs.compatibility_sha256 }}
      SUNDER_SDK_COMPATIBILITY_BASE_COMMIT: ${{ needs.stage.outputs.compatibility_base_commit }}
      SUNDER_SDK_COMPATIBILITY_BASE_SHA256: ${{ needs.stage.outputs.compatibility_base_sha256 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Publish with trusted publishing and verify each package before advancing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.stage.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --registry="$NPM_REGISTRY"
          mkdir release-assets
          python3 -B scripts/release/github_release.py download "$GITHUB_REF_NAME" --release-id "$RELEASE_ID" --directory release-assets
          bash scripts/release/preflight-npm-trusted-publishing.sh "$VERSION" "accept-v$VERSION" \
            "release-assets/sunder-sdk-$VERSION.tgz" "release-assets/sunder-package-tool-$VERSION.tgz" "release-assets/create-sunder-package-$VERSION.tgz"
          bash scripts/release/publish-sdk.sh npm "$VERSION" release-assets

  publish-nuget:
    needs: [prepare, stage, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUNDER_SDK_COMPATIBILITY_SHA256: ${{ needs.stage.outputs.compatibility_sha256 }}
      SUNDER_SDK_COMPATIBILITY_BASE_COMMIT: ${{ needs.stage.outputs.compatibility_base_commit }}
      SUNDER_SDK_COMPATIBILITY_BASE_SHA256: ${{ needs.stage.outputs.compatibility_base_sha256 }}
    environment: sunder-core-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Publish and verify six immutable NuGet versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_ID: ${{ needs.stage.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          python3 -B scripts/release/github_release.py download "$GITHUB_REF_NAME" --release-id "$RELEASE_ID" --directory release-assets
          bash scripts/release/publish-sdk.sh nuget "$VERSION" release-assets

  promote-npm:
    needs: [prepare, stage, publish-nuget]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUNDER_SDK_COMPATIBILITY_SHA256: ${{ needs.stage.outputs.compatibility_sha256 }}
      SUNDER_SDK_COMPATIBILITY_BASE_COMMIT: ${{ needs.stage.outputs.compatibility_base_commit }}
      SUNDER_SDK_COMPATIBILITY_BASE_SHA256: ${{ needs.stage.outputs.compatibility_base_sha256 }}
    environment: sunder-sdk-npm-promotion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Advance verified npm consumer channels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          RELEASE_ID: ${{ needs.stage.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --registry="$NPM_REGISTRY"
          mkdir release-assets
          python3 -B scripts/release/github_release.py download "$GITHUB_REF_NAME" --release-id "$RELEASE_ID" --directory release-assets
          bash scripts/release/publish-sdk.sh promote "$VERSION" release-assets

  finalize:
    needs: [prepare, stage, promote-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUNDER_SDK_COMPATIBILITY_SHA256: ${{ needs.stage.outputs.compatibility_sha256 }}
      SUNDER_SDK_COMPATIBILITY_BASE_COMMIT: ${{ needs.stage.outputs.compatibility_base_commit }}
      SUNDER_SDK_COMPATIBILITY_BASE_SHA256: ${{ needs.stage.outputs.compatibility_base_sha256 }}
    environment: sunder-github-release-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Recheck channels and finalize the same numeric release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.stage.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --registry="$NPM_REGISTRY"
          mkdir release-assets
          python3 -B scripts/release/github_release.py download "$GITHUB_REF_NAME" --release-id "$RELEASE_ID" --directory release-assets
          bash scripts/release/publish-sdk.sh verify "$VERSION" release-assets
          python3 -B scripts/release/github_release.py finalize "$GITHUB_REF_NAME" --directory release-assets
