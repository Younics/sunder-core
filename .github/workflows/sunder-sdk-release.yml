name: Sunder Core — Main CI and SDK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: sunder-core-package-release
  cancel-in-progress: false
jobs:
  select:
    name: SDK / Select independent package versions
    if: github.repository == 'Younics/sunder-core' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      # Draft discovery requires push access; evaluation receives no token.
      contents: write
    outputs:
      selected_count: ${{ steps.selection.outputs.selected_count }}
      nuget_count: ${{ steps.selection.outputs.nuget_count }}
      npm_count: ${{ steps.selection.outputs.npm_count }}
      recover: ${{ steps.selection.outputs.recover }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Recovery validates the original artifact source's ancestry.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Select only newer authored package versions
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release/sdk_release.py select
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-release-selection
          path: artifacts/release-plan.json
          if-no-files-found: error
          retention-days: 90

  validation:
    name: Validation
    needs: select
    if: needs.select.outputs.recover != 'true'
    uses: ./.github/workflows/sunder-ci.yml
    permissions:
      contents: read
      actions: read
    with:
      scope: all
      release-packages: ${{ needs.select.outputs.selected_count != '0' }}

  stage:
    name: SDK / Stage tested packages
    needs: [select, validation]
    if: always() && needs.select.result == 'success' && needs.select.outputs.selected_count != '0' && (needs.validation.result == 'success' || needs.select.outputs.recover == 'true')
    runs-on: ubuntu-24.04
    environment: sunder-core-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-release-selection
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.select.outputs.recover != 'true'
        with:
          name: sunder-tested-sdk
          path: artifacts/packages
      - name: Automatically tag and retain the tested archives
        if: needs.select.outputs.recover != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release/sdk_release.py stage --directory artifacts/retained-packages
      - name: Recover staged archives without rebuilding
        if: needs.select.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release/sdk_release.py download --directory artifacts/retained-packages

  publish-npm:
    name: npm libraries / Publish
    needs: [select, stage]
    if: always() && needs.stage.result == 'success' && needs.select.outputs.npm_count != '0'
    runs-on: ubuntu-24.04
    environment: sunder-core-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          dotnet: 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-release-selection
          path: artifacts
      - name: Download and verify retained package bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release/sdk_release.py download --directory artifacts/retained-packages
      - name: Publish missing npm versions to their consumer channels
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 -B scripts/release/sdk_release.py npm --directory artifacts/retained-packages

  publish-nuget:
    name: .NET libraries / Publish NuGet
    needs: [select, stage, publish-npm]
    if: always() && needs.stage.result == 'success' && needs.select.outputs.nuget_count != '0' && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: sunder-core-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-release-selection
          path: artifacts
      - name: Download and verify retained package bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release/sdk_release.py download --directory artifacts/retained-packages
      - name: Authenticate using NuGet Trusted Publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
      - name: Publish missing NuGet versions
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: python3 -B scripts/release/sdk_release.py nuget --directory artifacts/retained-packages

  finalize:
    name: SDK / Finalize accepted package releases
    needs: [select, stage, publish-npm, publish-nuget]
    if: always() && needs.stage.result == 'success' && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') && (needs.publish-nuget.result == 'success' || needs.publish-nuget.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: sunder-core-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-release-selection
          path: artifacts
      - name: Finalize retained releases after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/release/sdk_release.py download --directory artifacts/retained-packages
          python3 -B scripts/release/sdk_release.py finalize --directory artifacts/retained-packages

  summary:
    name: Results / SDK release overview
    if: always()
    needs: [select, validation, stage, publish-npm, publish-nuget, finalize]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.select.result == 'success'
        with:
          name: core-release-selection
          path: artifacts
      - name: Summarize selected versions and publication outcomes
        if: always()
        env:
          SUNDER_CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B scripts/release/sdk_release.py summary
