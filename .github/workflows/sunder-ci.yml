name: Sunder Core — CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        default: all
        options: [all, sdk, npm, dotnet, app, host, cli, repository]
  workflow_call:
    inputs:
      scope:
        description: Validation bundle; jobs expose individual component ownership.
        type: string
        required: true
      release-packages:
        description: Pack the caller's selected versions and test those exact candidates.
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read
concurrency:
  group: sunder-core-ci-${{ inputs.scope || 'all' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_SCOPE: ${{ inputs.scope || 'all' }}

jobs:
  preflight:
    name: Repository / Policy and documentation preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      components: ${{ steps.selection.outputs.components }}
      interop: ${{ steps.selection.outputs.interop }}
      platform_tests: ${{ steps.selection.outputs.platform_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dotnet: 'false'
      - name: Select component owners and execution lanes
        id: selection
        run: python3 -B scripts/ci/metadata.py components --scope "$CI_SCOPE"
      - name: Validate test ownership and documentation
        run: |
          node scripts/test-oracles/check-core-test-policy.mjs
          node scripts/toolchains.mjs
          node scripts/release/check-sdk-version.mjs
          python3 -B scripts/test/check-markdown-links.py --tracked .
          python3 -B scripts/release/sdk_release_documentation.py check
      - name: Compare supported release history and public surfaces
        if: env.CI_SCOPE == 'all' || env.CI_SCOPE == 'sdk'
        env:
          COMPATIBILITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$COMPATIBILITY_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse origin/main)"
            if [[ "$base" == "$(git rev-parse HEAD)" ]]; then base="$(git rev-parse HEAD^)"; fi
          fi
          node scripts/compatibility/check-supported-releases.mjs --base-ref "$base"

  components:
    name: ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.components) }}
    uses: ./.github/workflows/sunder-component-validation.yml
    with:
      scope: ${{ matrix.scope }}
      bundle: ${{ inputs.scope || 'all' }}
      release-packages: ${{ inputs.release-packages || false }}

  cross-language:
    name: Cross-language compatibility — .NET ↔ Node
    needs: preflight
    if: needs.preflight.outputs.interop == 'true'
    uses: ./.github/workflows/sunder-package-consumers.yml
    with:
      scenario: interop
      bundle: ${{ inputs.scope || 'all' }}

  templates:
    name: Package templates — Generate, build, package, run
    needs: [preflight, components]
    if: inputs.release-packages
    uses: ./.github/workflows/sunder-package-consumers.yml
    with:
      scenario: generated-templates
      bundle: ${{ inputs.scope || 'all' }}

  native:
    name: Native
    needs: preflight
    if: needs.preflight.outputs.platform_tests == 'true'
    uses: ./.github/workflows/sunder-host-validation.yml
    with:
      scope: ${{ inputs.scope || 'all' }}

  test-results:
    name: Results / Required validation gate
    if: always()
    needs: [preflight, components, cross-language, templates, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dotnet: 'false'
      - name: Download component, consumer and native reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-results-${{ env.CI_SCOPE }}-*
          path: artifacts/ci-results/${{ env.CI_SCOPE }}
      - name: Resolve job links for the component overview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "artifacts/ci-results/$CI_SCOPE"
          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '[.[].jobs[] | {name, html_url}]' > "artifacts/ci-results/$CI_SCOPE/jobs.json"; then
            echo '[]' > "artifacts/ci-results/$CI_SCOPE/jobs.json"
          fi
      - name: Audit required jobs and exact test selections
        if: always()
        env:
          RELEASE_PACKAGES: ${{ inputs.release-packages }}
          SUNDER_CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          args=()
          [[ "$RELEASE_PACKAGES" != true ]] || args+=(--require-scenario generated-templates)
          node scripts/test-oracles/summarize-core-test-results.mjs "artifacts/ci-results/$CI_SCOPE" --scope "$CI_SCOPE" --aggregate --component-layout --github-summary "${args[@]}"
      - name: Retain aggregate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-test-summary-${{ env.CI_SCOPE }}
          path: artifacts/ci-results/${{ env.CI_SCOPE }}/core-test-summary.json
          if-no-files-found: error
