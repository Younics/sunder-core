name: Sunder Core CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        default: all
        options: [all, sdk, app, host, cli, repository]
  workflow_call:
    inputs:
      scope:
        description: Component validation scope; main repository checks complement the SDK run.
        type: string
        required: true
      release-packages:
        description: Pack and validate the caller's selected project versions.
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
concurrency:
  group: sunder-core-ci-${{ inputs.scope || 'repository' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_SCOPE: ${{ inputs.scope || (github.event_name == 'push' && 'repository' || 'all') }}
jobs:
  build-test-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.release-packages
        with:
          name: core-release-selection
          path: artifacts
      - name: Compare supported release history and public surfaces
        if: env.CI_SCOPE == 'all' || env.CI_SCOPE == 'sdk'
        env:
          COMPATIBILITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$COMPATIBILITY_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse origin/main)"
            if [[ "$base" == "$(git rev-parse HEAD)" ]]; then base="$(git rev-parse HEAD^)"; fi
          fi
          node scripts/compatibility/check-supported-releases.mjs --base-ref "$base"
      - name: Build and test
        id: tests
        run: python3 -B scripts/ci/core_ci.py portable --scope "$CI_SCOPE"
      - name: Pack and test selected developer packages
        if: inputs.release-packages
        run: python3 -B scripts/ci/core_ci.py candidate --scope "$CI_SCOPE"
      - name: Retain the tested candidate feed
        if: inputs.release-packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-tested-sdk
          path: artifacts/packages/*
          if-no-files-found: error
      - name: Retain test reports
        if: always() && steps.tests.outcome != 'skipped' && steps.tests.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-core-results-${{ env.CI_SCOPE }}
          path: artifacts/test-results/${{ env.CI_SCOPE }}
          if-no-files-found: error
          retention-days: 14

  native:
    if: inputs.scope != 'cli'
    uses: ./.github/workflows/sunder-host-validation.yml
    with:
      scope: ${{ inputs.scope || (github.event_name == 'push' && 'repository' || 'all') }}

  test-results:
    if: ${{ !cancelled() && needs.build-test-pack.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    needs: [build-test-pack, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dotnet: 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-core-results-${{ env.CI_SCOPE }}
          path: artifacts/ci-results/${{ env.CI_SCOPE }}/core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.native.result == 'success'
        with:
          pattern: sunder-platform-${{ env.CI_SCOPE }}-*
          path: artifacts/ci-results/${{ env.CI_SCOPE }}/platform
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.CI_SCOPE == 'all' || env.CI_SCOPE == 'sdk' || env.CI_SCOPE == 'host'
        with:
          pattern: official-runtime-${{ env.CI_SCOPE }}-*
          path: artifacts/ci-results/${{ env.CI_SCOPE }}/official
      - name: Audit owning-job reports without rebuilding or rerunning tests
        env:
          RELEASE_PACKAGES: ${{ inputs.release-packages }}
        run: |
          args=()
          [[ "$RELEASE_PACKAGES" != true ]] || args+=(--require-scenario generated-templates)
          node scripts/test-oracles/summarize-core-test-results.mjs "artifacts/ci-results/$CI_SCOPE" --scope "$CI_SCOPE" --aggregate "${args[@]}"
