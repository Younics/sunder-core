name: Sunder App — Release

on:
  push:
    tags: ["app/v*"]

permissions: {}
concurrency:
  group: sunder-release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_CHANNEL: stable
  RELEASE_REPO_URL: https://github.com/${{ github.repository }}

jobs:
  validation:
    name: App / Validation
    uses: ./.github/workflows/sunder-ci.yml
    with:
      scope: app
    permissions:
      contents: read
      actions: read

  runtime-validation:
    name: Host / Validation
    uses: ./.github/workflows/sunder-ci.yml
    with:
      scope: host
    permissions:
      contents: read
      actions: read

  prepare:
    name: App / Select version and platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.platforms.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: release
        run: python3 -B scripts/release/github_release.py metadata "$GITHUB_REF_NAME"
      - id: platforms
        run: python3 -B scripts/ci/metadata.py matrices

  package:
    name: App / Package and sign / ${{ matrix.rid }}
    needs: [prepare, validation, runtime-validation]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: sunder-app-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RUNTIME: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          packaging: 'true'
      - name: Install Velopack CLI
        shell: pwsh
        run: ./scripts/release/install-velopack.ps1
      - name: Azure login for Windows signing
        if: runner.os == 'Windows'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure Azure Trusted Signing
        id: windows-signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: ./scripts/release/configure-windows-signing.ps1
      - name: Configure Apple signing and notarization
        id: apple-signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
        run: bash scripts/release/configure-apple-signing.sh
      - name: Package Sunder for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT || secrets.WINDOWS_PUBLISHER_SUBJECT }}
          DLIB_PATH: ${{ steps.windows-signing.outputs.dlib_path }}
          METADATA_PATH: ${{ steps.windows-signing.outputs.metadata_path }}
        run: |
          ./scripts/release/package-sunder.ps1 -Version $env:VERSION -Runtime $env:RUNTIME -Channel $env:RELEASE_CHANNEL `
            -GitHubRepositoryUrl $env:RELEASE_REPO_URL -StrictRelease `
            -WindowsSignParams "/fd SHA256 /td SHA256 /tr http://timestamp.acs.microsoft.com /dlib `"$env:DLIB_PATH`" /dmdf `"$env:METADATA_PATH`"" `
            -WindowsPublisherSubject $env:WINDOWS_PUBLISHER_SUBJECT
      - name: Package Sunder for Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PROFILE: ${{ steps.apple-signing.outputs.notary_profile }}
          APPLE_KEYCHAIN_PATH: ${{ steps.apple-signing.outputs.keychain_path }}
        run: |
          arguments=(--version "$VERSION" --runtime "$RUNTIME" --channel "$RELEASE_CHANNEL" --github-repository-url "$RELEASE_REPO_URL" --strict-release)
          if [[ "$RUNNER_OS" == macOS ]]; then
            arguments+=(--mac-sign-app-identity "$APPLE_SIGN_APP_IDENTITY" --mac-notary-profile "$APPLE_NOTARY_PROFILE" --mac-keychain "$APPLE_KEYCHAIN_PATH" --mac-team-id "$APPLE_TEAM_ID")
          fi
          bash scripts/release/package-sunder.sh "${arguments[@]}"
      - name: Inspect the signed and notarized mounted DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release/macos/verify-sunder-dmg.sh "artifacts/velopack/$RELEASE_CHANNEL/$RUNTIME/Sunder-app-$RUNTIME-$RELEASE_CHANNEL.dmg" "$RUNTIME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-app-release-${{ matrix.rid }}
          path: artifacts/velopack/${{ env.RELEASE_CHANNEL }}/${{ matrix.rid }}/*
          if-no-files-found: error
      - name: Clean up Apple signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_KEYCHAIN_PATH: ${{ steps.apple-signing.outputs.keychain_path }}
        run: |
          if [[ -n "$APPLE_KEYCHAIN_PATH" && -f "$APPLE_KEYCHAIN_PATH" ]]; then security delete-keychain "$APPLE_KEYCHAIN_PATH"; fi

  release:
    name: App / Publish verified installers
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: sunder-github-release-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
          packaging: 'true'
      - name: Install the feed tool with its supported SDK
        shell: pwsh
        run: ./scripts/release/install-velopack.ps1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-app-release-*
          path: release-assets
      - name: Generate Full-only update feeds and publish exact App assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -B scripts/release/generate-app-feeds.py release-assets --channel "$RELEASE_CHANNEL"
          python3 -B scripts/release/github_release.py stage "$GITHUB_REF_NAME" --directory release-assets --channel "$RELEASE_CHANNEL"
          python3 -B scripts/release/github_release.py finalize "$GITHUB_REF_NAME" --directory release-assets --channel "$RELEASE_CHANNEL"
