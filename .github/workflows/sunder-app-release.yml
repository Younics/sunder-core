name: Sunder App Release

on:
  push:
    tags: ["app/v*"]

permissions: {}
concurrency:
  group: sunder-release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  DOTNET_VERSION: "10.0.100"
  VELOPACK_VERSION: "1.2.161"
  RELEASE_CHANNEL: stable
  RELEASE_REPO_URL: https://github.com/${{ github.repository }}

jobs:
  validation:
    uses: ./.github/workflows/sunder-host-validation.yml
    permissions:
      contents: read

  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: release
        run: python3 -B scripts/release/github_release.py metadata "$GITHUB_REF_NAME"

  package:
    needs: [prepare, validation]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: sunder-app-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runtime: win-x64, os: windows-2022}
          # The Azure signing tool runs on x64 while signing both Windows targets.
          - {runtime: win-arm64, os: windows-2022}
          - {runtime: linux-x64, os: ubuntu-24.04}
          - {runtime: linux-arm64, os: ubuntu-24.04-arm}
          - {runtime: osx-x64, os: macos-15-intel}
          - {runtime: osx-arm64, os: macos-15}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}
            9.0.100
            8.0.100
      - name: Install Velopack CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $(if ($IsWindows) { $env:USERPROFILE } else { $env:HOME }) ".dotnet/tools"
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $sdk = Join-Path $env:RUNNER_TEMP "velopack-sdk"
          dotnet new globaljson --sdk-version 9.0.100 --roll-forward disable --output $sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location $sdk
          try {
            dotnet tool install --global vpk --version $env:VELOPACK_VERSION
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Azure login for Windows signing
        if: startsWith(matrix.runtime, 'win-')
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure Azure Trusted Signing
        id: windows-signing
        if: startsWith(matrix.runtime, 'win-')
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT || secrets.WINDOWS_PUBLISHER_SUBJECT }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("AZURE_TRUSTED_SIGNING_ENDPOINT", "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME", "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME", "WINDOWS_PUBLISHER_SUBJECT")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing setting: $name" }
          }
          $archive = Join-Path $env:RUNNER_TEMP "artifact-signing-client.zip"
          $root = Join-Path $env:RUNNER_TEMP "artifact-signing-client"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B") { throw "Signing client checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $dlibs = @(Get-ChildItem $root -Filter Azure.CodeSigning.Dlib.dll -Recurse | Where-Object { $_.FullName -match "[\\/]x64[\\/]" })
          if ($dlibs.Count -ne 1) { throw "Expected exactly one x64 signing client" }
          $metadataPath = Join-Path $env:RUNNER_TEMP "trusted-signing-metadata.json"
          [ordered]@{
            Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
            ExcludeCredentials = @("EnvironmentCredential", "ManagedIdentityCredential", "WorkloadIdentityCredential", "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential", "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential")
          } | ConvertTo-Json -Depth 4 | Out-File $metadataPath -Encoding utf8
          "dlib_path=$($dlibs[0].FullName)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "metadata_path=$metadataPath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Configure Apple signing and notarization
        id: apple-signing
        if: startsWith(matrix.runtime, 'osx-')
        shell: bash
        env:
          APPLE_BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
        run: |
          set -euo pipefail
          for name in APPLE_BUILD_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_KEYCHAIN_PASSWORD APPLE_SIGN_APP_IDENTITY; do
            test -n "${!name}" || { echo "Missing Apple signing setting: $name" >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/apple-build-certificate.p12"
          keychain="$RUNNER_TEMP/sunder-app-signing.keychain-db"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_BUILD_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          xcrun notarytool store-credentials sunder-app-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
          echo "keychain_path=$keychain" >> "$GITHUB_OUTPUT"
          echo "notary_profile=sunder-app-notary" >> "$GITHUB_OUTPUT"
      - name: Package Sunder for Windows
        if: startsWith(matrix.runtime, 'win-')
        shell: pwsh
        env:
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT || secrets.WINDOWS_PUBLISHER_SUBJECT }}
          DLIB_PATH: ${{ steps.windows-signing.outputs.dlib_path }}
          METADATA_PATH: ${{ steps.windows-signing.outputs.metadata_path }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          $ErrorActionPreference = "Stop"
          $arguments = @{
            Version = $env:VERSION; Runtime = $env:RUNTIME; Channel = $env:RELEASE_CHANNEL
            GitHubRepositoryUrl = $env:RELEASE_REPO_URL; StrictRelease = $true
            WindowsSignParams = "/fd SHA256 /td SHA256 /tr http://timestamp.acs.microsoft.com /dlib `"$env:DLIB_PATH`" /dmdf `"$env:METADATA_PATH`""
            WindowsPublisherSubject = $env:WINDOWS_PUBLISHER_SUBJECT
          }
          ./scripts/release/package-sunder.ps1 @arguments
      - name: Package Sunder for Unix
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PROFILE: ${{ steps.apple-signing.outputs.notary_profile }}
          APPLE_KEYCHAIN_PATH: ${{ steps.apple-signing.outputs.keychain_path }}
        run: |
          set -euo pipefail
          arguments=(--version "$VERSION" --runtime "$RUNTIME" --channel "$RELEASE_CHANNEL" --github-repository-url "$RELEASE_REPO_URL" --strict-release)
          if [[ "$RUNTIME" == osx-* ]]; then
            arguments+=(--mac-bundle-id com.younics.sunder --mac-sign-app-identity "$APPLE_SIGN_APP_IDENTITY" --mac-notary-profile "$APPLE_NOTARY_PROFILE" --mac-keychain "$APPLE_KEYCHAIN_PATH" --mac-team-id "$APPLE_TEAM_ID")
          fi
          bash scripts/release/package-sunder.sh "${arguments[@]}"
      - name: Inspect the signed and notarized mounted DMG
        if: startsWith(matrix.runtime, 'osx-')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          dmg="artifacts/velopack/$RELEASE_CHANNEL/$RUNTIME/Sunder-app-$RUNTIME-$RELEASE_CHANNEL.dmg"
          hdiutil verify "$dmg" >/dev/null
          codesign --verify --strict "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"
          mount="$(mktemp -d "$RUNNER_TEMP/sunder-dmg.XXXXXX")"
          trap 'hdiutil detach "$mount" -quiet >/dev/null 2>&1 || true; rmdir "$mount"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg" >/dev/null
          test -d "$mount/Sunder.app"
          test -L "$mount/Applications" && test "$(readlink "$mount/Applications")" = /Applications
          test -s "$mount/.background/Sunder.tiff" && test -s "$mount/.DS_Store"
          shopt -s nullglob
          visible=("$mount"/*); test "${#visible[@]}" = 2
          for hidden in "$mount"/.[!.]*; do
            case "$(basename "$hidden")" in .background|.DS_Store) ;; *) exit 1 ;; esac
          done
          app="$mount/Sunder.app"
          codesign --verify --deep --strict "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.younics.sunder
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          architecture=x86_64; [[ "$RUNTIME" != osx-arm64 ]] || architecture=arm64
          lipo -archs "$app/Contents/MacOS/$executable" | grep -w "$architecture"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-app-release-${{ matrix.runtime }}
          path: artifacts/velopack/${{ env.RELEASE_CHANNEL }}/${{ matrix.runtime }}/*
          if-no-files-found: error
      - name: Clean up Apple signing keychain
        if: ${{ always() && startsWith(matrix.runtime, 'osx-') }}
        shell: bash
        env:
          APPLE_KEYCHAIN_PATH: ${{ steps.apple-signing.outputs.keychain_path }}
        run: |
          if [[ -n "$APPLE_KEYCHAIN_PATH" && -f "$APPLE_KEYCHAIN_PATH" ]]; then security delete-keychain "$APPLE_KEYCHAIN_PATH"; fi

  release:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: sunder-github-release-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}
            9.0.100
      - name: Install the feed tool with its supported SDK
        run: |
          dotnet new globaljson --sdk-version 9.0.100 --roll-forward disable --output "$RUNNER_TEMP/velopack-sdk"
          (cd "$RUNNER_TEMP/velopack-sdk" && dotnet tool install --global vpk --version "$VELOPACK_VERSION")
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-app-release-*
          path: release-assets
      - name: Generate Full-only update feeds and publish exact App assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            output="release-assets/sunder-app-release-$rid"
            target="$RUNNER_TEMP/app-feed-$rid"
            mkdir "$target"
            vpk upload local --path "$target" --regenerate --channel "app-$rid-$RELEASE_CHANNEL" --outputDir "$output"
            cp "$target/releases.app-$rid-$RELEASE_CHANNEL.json" "$output/"
          done
          python3 -B scripts/release/github_release.py stage "$GITHUB_REF_NAME" --directory release-assets --channel "$RELEASE_CHANNEL"
          python3 -B scripts/release/github_release.py finalize "$GITHUB_REF_NAME" --directory release-assets --channel "$RELEASE_CHANNEL"
