name: Sunder App Release

on:
  push:
    tags:
      - "app/v*"

permissions: {}

concurrency:
  group: sunder-release-draft-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.100"
  VELOPACK_VERSION: "0.0.1298"
  RELEASE_CHANNEL: stable
  RELEASE_REPO_URL: https://github.com/${{ github.repository }}

jobs:
  host-validation:
    name: Validate Supervisor and Runtime
    uses: ./.github/workflows/sunder-host-validation.yml
    permissions:
      contents: read

  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^app/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]]; then
            echo "App release tags must use SemVer format, for example app/v0.1.0 or app/v0.1.0-beta.1." >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          is_prerelease="false"
          if [[ "$version" == *-* ]]; then
            is_prerelease="true"
            prerelease="${version#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0* && "$identifier" != "0" ]]; then
                echo "Numeric SemVer prerelease identifiers must not contain leading zeroes." >&2
                exit 1
              fi
            done
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.runtime }}
    needs:
      - prepare
      - host-validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: sunder-app-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-2022
          - runtime: win-arm64
            os: windows-2022
          - runtime: linux-x64
            os: ubuntu-24.04
          - runtime: linux-arm64
            os: ubuntu-24.04-arm
          - runtime: osx-x64
            os: macos-14
          - runtime: osx-arm64
            os: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}
            9.0.100
            8.0.100

      - name: Add .NET tools to PATH
        shell: pwsh
        run: |
          $toolsPath = if ($IsWindows) {
            Join-Path $env:USERPROFILE ".dotnet\tools"
          } else {
            Join-Path $env:HOME ".dotnet/tools"
          }

          $toolsPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version $env:VELOPACK_VERSION

      - name: Azure login for Windows signing
        if: startsWith(matrix.runtime, 'win-')
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure Trusted Signing
        id: windows-signing
        if: startsWith(matrix.runtime, 'win-')
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT || secrets.WINDOWS_PUBLISHER_SUBJECT }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredVariables = @(
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME",
            "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME",
            "WINDOWS_PUBLISHER_SUBJECT"
          )

          foreach ($variableName in $requiredVariables) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($variableName))) {
              throw "Azure Trusted Signing value '$variableName' is not configured on the GitHub environment."
            }
          }

          $clientPackage = Join-Path $env:RUNNER_TEMP "artifact-signing-client.1.0.128.zip"
          $clientRoot = Join-Path $env:RUNNER_TEMP "artifact-signing-client"
          Invoke-WebRequest `
            -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg" `
            -OutFile $clientPackage
          if ((Get-FileHash -LiteralPath $clientPackage -Algorithm SHA256).Hash -ne "74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B") {
            throw "Microsoft.ArtifactSigning.Client package digest validation failed."
          }
          Expand-Archive -LiteralPath $clientPackage -DestinationPath $clientRoot

          $dlibs = @(Get-ChildItem -Path $clientRoot -Filter "Azure.CodeSigning.Dlib.dll" -Recurse |
            Where-Object { $_.FullName -match "[\\/]x64[\\/]" })
          if ($dlibs.Count -ne 1) {
            throw "Expected exactly one x64 Azure.CodeSigning.Dlib.dll in the Artifact Signing client package, found $($dlibs.Count)."
          }
          $dlib = $dlibs[0]

          $metadataPath = Join-Path $env:RUNNER_TEMP "trusted-signing-metadata.json"
          $metadata = [ordered]@{
            Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
            CorrelationId = "sunder-app-${{ github.run_id }}-${{ matrix.runtime }}"
            ExcludeCredentials = @(
              "EnvironmentCredential",
              "ManagedIdentityCredential",
              "WorkloadIdentityCredential",
              "SharedTokenCacheCredential",
              "VisualStudioCredential",
              "VisualStudioCodeCredential",
              "AzurePowerShellCredential",
              "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential"
            )
          }
          $metadata | ConvertTo-Json -Depth 4 | Out-File -FilePath $metadataPath -Encoding utf8

          "dlib_path=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "metadata_path=$metadataPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Configure Apple signing and notarization
        id: apple-signing
        if: startsWith(matrix.runtime, 'osx-')
        shell: bash
        env:
          APPLE_BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
        run: |
          set -euo pipefail

          required_vars=(
            APPLE_BUILD_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
            APPLE_SIGNING_KEYCHAIN_PASSWORD
            APPLE_SIGN_APP_IDENTITY
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "Apple signing secret '$var_name' is not configured." >&2
              exit 1
            fi
          done

          decode_base64() {
            local value="$1"
            local output="$2"

            if printf '%s' "$value" | base64 --decode > "$output" 2>/dev/null; then
              return 0
            fi

            printf '%s' "$value" | base64 -D > "$output"
          }

          build_cert_path="$RUNNER_TEMP/apple-build-certificate.p12"
          keychain_path="$RUNNER_TEMP/sunder-app-signing.keychain-db"
          notary_profile="sunder-app-notary"

          decode_base64 "$APPLE_BUILD_CERTIFICATE_BASE64" "$build_cert_path"

          security create-keychain -p "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security import "$build_cert_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain_path" >/dev/null

          rm -f "$build_cert_path"

          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain_path"

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "notary_profile=$notary_profile" >> "$GITHUB_OUTPUT"

      - name: Package Sunder for Windows
        if: startsWith(matrix.runtime, 'win-')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT || secrets.WINDOWS_PUBLISHER_SUBJECT }}
        run: |
          $dlibPath = "${{ steps.windows-signing.outputs.dlib_path }}"
          $metadataPath = "${{ steps.windows-signing.outputs.metadata_path }}"
          $windowsSignParams = "/fd SHA256 /td SHA256 /tr http://timestamp.acs.microsoft.com /dlib `"$dlibPath`" /dmdf `"$metadataPath`""

          $packageArgs = @{
            Version = "${{ needs.prepare.outputs.version }}"
            Runtime = "${{ matrix.runtime }}"
            Channel = "${{ env.RELEASE_CHANNEL }}"
            GitHubRepositoryUrl = "${{ env.RELEASE_REPO_URL }}"
            StrictRelease = $true
            WindowsSignParams = $windowsSignParams
            WindowsPublisherSubject = $env:WINDOWS_PUBLISHER_SUBJECT
          }

          if ("${{ needs.prepare.outputs.is_prerelease }}" -eq "true") {
            $packageArgs.IncludePrereleaseUpdates = $true
          }

          ./scripts/release/package-sunder.ps1 @packageArgs

      - name: Package Sunder for Unix
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PROFILE: ${{ steps.apple-signing.outputs.notary_profile }}
          APPLE_KEYCHAIN_PATH: ${{ steps.apple-signing.outputs.keychain_path }}
        run: |
          set -euo pipefail

          package_args=(
            ./scripts/release/package-sunder.sh
            --version "${{ needs.prepare.outputs.version }}"
            --runtime "${{ matrix.runtime }}"
            --channel "${RELEASE_CHANNEL}"
            --github-repository-url "${RELEASE_REPO_URL}"
            --strict-release
          )

          if [[ "${{ startsWith(matrix.runtime, 'osx-') }}" == "true" ]]; then
            package_args+=(
              --mac-bundle-id com.younics.sunder
              --mac-sign-app-identity "$APPLE_SIGN_APP_IDENTITY"
              --mac-notary-profile "$APPLE_NOTARY_PROFILE"
              --mac-keychain "$APPLE_KEYCHAIN_PATH"
              --mac-team-id "$APPLE_TEAM_ID"
            )
          fi

          if [[ "${{ needs.prepare.outputs.is_prerelease }}" == "true" ]]; then
            package_args+=(--include-prerelease-updates)
          fi

          bash "${package_args[@]}"

      - name: Validate custom macOS DMG
        if: startsWith(matrix.runtime, 'osx-')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          output_dir="artifacts/velopack/$RELEASE_CHANNEL/$RUNTIME"
          expected_dmg="$output_dir/Sunder-app-$RUNTIME-$RELEASE_CHANNEL.dmg"
          dmg_files=("$output_dir"/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 || "${dmg_files[0]}" != "$expected_dmg" ]]; then
            echo "Expected exactly one custom macOS DMG named '$(basename "$expected_dmg")'." >&2
            exit 1
          fi

          hdiutil verify "$expected_dmg" >/dev/null
          codesign --verify --strict --verbose=2 "$expected_dmg"
          dmg_team_id="$(codesign --display --verbose=4 "$expected_dmg" 2>&1 \
            | sed -n 's/^TeamIdentifier=//p' | sed -n '1p')"
          [[ "$dmg_team_id" == "$APPLE_TEAM_ID" ]] || { echo "DMG Team ID verification failed." >&2; exit 1; }
          xcrun stapler validate "$expected_dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$expected_dmg"

          mount_dir="$(mktemp -d "$RUNNER_TEMP/sunder-dmg.XXXXXX")"
          mounted="false"
          cleanup_mount() {
            if [[ "$mounted" == "true" ]]; then
              hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            fi
            rm -rf "$mount_dir"
          }
          trap cleanup_mount EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$expected_dmg" >/dev/null
          mounted="true"
          app_path="$mount_dir/Sunder.app"
          applications_link="$mount_dir/Applications"
          background_path="$mount_dir/.background/Sunder.tiff"
          finder_layout="$mount_dir/.DS_Store"
          [[ -d "$app_path" ]] || { echo "Sunder.app is missing from the DMG." >&2; exit 1; }
          [[ -L "$applications_link" && "$(readlink "$applications_link")" == "/Applications" ]] \
            || { echo "The Applications symlink is missing from the DMG." >&2; exit 1; }
          [[ -f "$background_path" && -s "$background_path" ]] \
            || { echo "The Sunder Finder background is missing from the DMG." >&2; exit 1; }
          [[ -f "$finder_layout" && -s "$finder_layout" ]] \
            || { echo "The Sunder Finder layout is missing from the DMG." >&2; exit 1; }
          visible_entries=("$mount_dir"/*)
          if [[ ${#visible_entries[@]} -ne 2 ]]; then
            printf 'Unexpected visible DMG entry: %s\n' "${visible_entries[@]}" >&2
            exit 1
          fi
          hidden_entries=("$mount_dir"/.[!.]*)
          for hidden_entry in "${hidden_entries[@]}"; do
            case "$(basename "$hidden_entry")" in
              .background|.DS_Store) ;;
              *) echo "Unexpected hidden DMG entry: $hidden_entry" >&2; exit 1 ;;
            esac
          done

          codesign --verify --deep --strict --verbose=2 "$app_path"
          app_team_id="$(codesign --display --verbose=4 "$app_path" 2>&1 \
            | sed -n 's/^TeamIdentifier=//p' | sed -n '1p')"
          [[ "$app_team_id" == "$APPLE_TEAM_ID" ]] || { echo "Sunder.app Team ID verification failed." >&2; exit 1; }
          app_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
          [[ "$app_bundle_id" == "com.younics.sunder" ]] || { echo "Sunder.app bundle ID verification failed." >&2; exit 1; }
          app_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          app_architectures="$(lipo -archs "$app_path/Contents/MacOS/$app_executable")"
          expected_architecture="x86_64"
          [[ "$RUNTIME" == "osx-arm64" ]] && expected_architecture="arm64"
          [[ " $app_architectures " == *" $expected_architecture "* ]] \
            || { echo "Sunder.app does not contain expected architecture '$expected_architecture'." >&2; exit 1; }
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-app-release-${{ matrix.runtime }}
          path: artifacts/velopack/${{ env.RELEASE_CHANNEL }}/${{ matrix.runtime }}/*
          if-no-files-found: error
          retention-days: 90

      - name: Clean up Apple signing keychain
        if: ${{ always() && startsWith(matrix.runtime, 'osx-') }}
        shell: bash
        env:
          APPLE_KEYCHAIN_PATH: ${{ steps.apple-signing.outputs.keychain_path }}
        run: |
          set -euo pipefail

          if [[ -n "${APPLE_KEYCHAIN_PATH:-}" && -f "$APPLE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH"
          fi

  create-draft:
    name: Create and byte-verify private GitHub draft
    needs:
      - prepare
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}
            9.0.100

      - name: Add .NET tools to PATH
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install --global vpk --version "$VELOPACK_VERSION"

      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: sunder-app-release-*

      - name: Create and verify draft release assets
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag="app/v$VERSION"
          bash scripts/release/verify-release-tag.sh "$tag"
          expected_setup_assets=(
            "release-assets/sunder-app-release-win-x64/Sunder-app-win-x64-$RELEASE_CHANNEL-Setup.exe"
            "release-assets/sunder-app-release-win-arm64/Sunder-app-win-arm64-$RELEASE_CHANNEL-Setup.exe"
          )
          expected_appimage_assets=(
            "release-assets/sunder-app-release-linux-x64/Sunder-app-linux-x64-$RELEASE_CHANNEL.AppImage"
            "release-assets/sunder-app-release-linux-arm64/Sunder-app-linux-arm64-$RELEASE_CHANNEL.AppImage"
          )
          expected_dmg_assets=(
            "release-assets/sunder-app-release-osx-x64/Sunder-app-osx-x64-$RELEASE_CHANNEL.dmg"
            "release-assets/sunder-app-release-osx-arm64/Sunder-app-osx-arm64-$RELEASE_CHANNEL.dmg"
          )
          expected_distribution_assets=(
            "${expected_setup_assets[@]}"
            "${expected_appimage_assets[@]}"
            "${expected_dmg_assets[@]}"
          )
          for asset in "${expected_distribution_assets[@]}"; do
            test -f "$asset" || { echo "Missing exact Sunder distribution asset: $asset" >&2; exit 1; }
          done

          setup_assets=(release-assets/sunder-app-release-*/*-Setup.exe)
          appimage_assets=(release-assets/sunder-app-release-*/*.AppImage)
          dmg_assets=(release-assets/sunder-app-release-*/*.dmg)
          if [[ ${#setup_assets[@]} -ne 2 || ${#appimage_assets[@]} -ne 2 || ${#dmg_assets[@]} -ne 2 ]]; then
            echo "Expected exactly two Setup.exe, two AppImage, and two DMG distribution assets." >&2
            exit 1
          fi

          alternate_distribution_assets=(
            release-assets/sunder-app-release-*/*-Setup.pkg
            release-assets/sunder-app-release-*/*-Portable.zip
          )
          if [[ ${#alternate_distribution_assets[@]} -ne 0 ]]; then
            printf 'Unexpected alternate distribution artifact: %s\n' "${alternate_distribution_assets[@]}" >&2
            exit 1
          fi

          runtimes=(win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64)
          expected_remote_names=()
          expected_manifest_names=()
          for runtime in "${runtimes[@]}"; do
            output_dir="release-assets/sunder-app-release-$runtime"
            full_name="Sunder-$VERSION-app-$runtime-$RELEASE_CHANNEL-full.nupkg"
            manifest_name="releases.app-$runtime-$RELEASE_CHANNEL.json"
            test -f "$output_dir/$full_name" \
              || { echo "Missing exact App Full package: $output_dir/$full_name" >&2; exit 1; }
            expected_remote_names+=("$full_name" "$manifest_name")
            expected_manifest_names+=("$manifest_name")
            case "$runtime" in
              win-*) expected_remote_names+=("Sunder-app-$runtime-$RELEASE_CHANNEL-Setup.exe") ;;
              linux-*) expected_remote_names+=("Sunder-app-$runtime-$RELEASE_CHANNEL.AppImage") ;;
              osx-*) expected_remote_names+=("Sunder-app-$runtime-$RELEASE_CHANNEL.dmg") ;;
            esac
          done
          expected_remote_names+=(SHA256SUMS release-provenance.json release-sbom.spdx.json toolchain.txt)

          created_release=false
          verified_release=false
          set +e
          release_json="$(bash scripts/release/resolve-github-release.sh "$tag")"
          resolve_status=$?
          set -e
          if [[ $resolve_status -eq 4 ]]; then
            create_args=(
              release create "$tag"
              --title "Sunder App $VERSION"
              --notes "Automated Sunder App draft publication for $VERSION."
              --latest=false
              --verify-tag
            )
            [[ "$IS_PRERELEASE" != "true" ]] || create_args+=(--prerelease)
            gh "${create_args[@]}" --draft
            created_release=true
            for _ in {1..30}; do
              if release_json="$(bash scripts/release/resolve-github-release.sh "$tag")"; then break; fi
              release_json=''
              sleep 2
            done
            [[ -n "$release_json" ]] || { echo "Created App draft was not discoverable through authenticated release listing." >&2; exit 1; }
          elif [[ $resolve_status -ne 0 ]]; then
            exit "$resolve_status"
          fi
          release_id="$(jq -r '.id' <<< "$release_json")"
          jq -e --argjson release_id "$release_id" --arg tag "$tag" --argjson prerelease "$IS_PRERELEASE" '
            .id == $release_id and .tag_name == $tag and .draft == true and .prerelease == $prerelease
          ' <<< "$release_json" >/dev/null \
            || { echo "App release identity, draft state, or prerelease state is unexpected." >&2; exit 1; }
          cleanup_failed_release() {
            exit_code=$?
            if [[ $exit_code -ne 0 && "$created_release" == true && "$verified_release" != true ]]; then
              gh api --method DELETE "repos/$GH_REPO/releases/$release_id" >/dev/null 2>&1 || true
            fi
            exit "$exit_code"
          }
          trap cleanup_failed_release EXIT

          remote_asset_count="$(jq '.assets | length' <<< "$release_json")"
          if [[ "$remote_asset_count" == 0 ]]; then
            for runtime in "${runtimes[@]}"; do
              output_dir="release-assets/sunder-app-release-$runtime"
              channel="app-$runtime-$RELEASE_CHANNEL"
              manifest_name="releases.app-$runtime-$RELEASE_CHANNEL.json"
              manifest_target="$RUNNER_TEMP/sunder-app-manifest-$runtime"
              mkdir "$manifest_target"
              vpk upload local \
                --path "$manifest_target" \
                --regenerate \
                --channel "$channel" \
                --outputDir "$output_dir"
              [[ -f "$manifest_target/$manifest_name" ]] \
                || { echo "Velopack did not generate '$manifest_name' locally." >&2; exit 1; }
              cp "$manifest_target/$manifest_name" "$output_dir/$manifest_name"
            done
            GITHUB_RELEASE_ID="$release_id" \
              bash scripts/release/generate-release-evidence.sh release-assets "sunder-core=$GITHUB_SHA"
            upload_assets=("${expected_distribution_assets[@]}")
            for runtime in "${runtimes[@]}"; do
              output_dir="release-assets/sunder-app-release-$runtime"
              upload_assets+=(
                "$output_dir/Sunder-$VERSION-app-$runtime-$RELEASE_CHANNEL-full.nupkg"
                "$output_dir/releases.app-$runtime-$RELEASE_CHANNEL.json"
              )
            done
            bash scripts/release/upload-github-release-assets.sh "$release_id" "$tag" \
              "${upload_assets[@]}" \
              release-assets/SHA256SUMS \
              release-assets/release-provenance.json \
              release-assets/release-sbom.spdx.json \
              release-assets/toolchain.txt
            evidence_run_attempt="$GITHUB_RUN_ATTEMPT"
          else
            bash scripts/release/download-github-release-assets.sh "$release_id" "$tag" release-assets \
              "${expected_manifest_names[@]}" \
              SHA256SUMS release-provenance.json release-sbom.spdx.json toolchain.txt
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow_ref "$GITHUB_REPOSITORY/.github/workflows/sunder-app-release.yml@refs/tags/$tag" \
              --arg run_id "$GITHUB_RUN_ID" \
              --argjson release_id "$release_id" \
              --arg ref "refs/tags/$tag" \
              --arg source_sha "$GITHUB_SHA" '
                .invocation.repository == $repository
                and .invocation.workflowRef == $workflow_ref
                and .invocation.runId == $run_id
                and .invocation.releaseId == $release_id
                and .invocation.ref == $ref
                and .invocation.sha == $source_sha
                and .sources == [{name:"sunder-core",sha:$source_sha}]
              ' release-assets/release-provenance.json >/dev/null \
              || { echo "Existing App draft was verified by another publication run or source." >&2; exit 1; }
            evidence_run_attempt="$(jq -r '.invocation.runAttempt' release-assets/release-provenance.json)"
            [[ "$evidence_run_attempt" =~ ^[1-9][0-9]*$ ]] \
              || { echo "Existing App publication attempt is invalid." >&2; exit 1; }
          fi

          for runtime in "${runtimes[@]}"; do
            output_dir="release-assets/sunder-app-release-$runtime"
            manifest_name="releases.app-$runtime-$RELEASE_CHANNEL.json"
            manifest_path="$output_dir/$manifest_name"
            [[ -f "$manifest_path" ]] || manifest_path="release-assets/$manifest_name"
            full_name="Sunder-$VERSION-app-$runtime-$RELEASE_CHANNEL-full.nupkg"
            delta_name="Sunder-$VERSION-app-$runtime-$RELEASE_CHANNEL-delta.nupkg"
            jq -e --arg full "$full_name" --arg delta "$delta_name" '
              .Assets as $assets
              | ($assets | type == "array" and length == 1)
              and ([$assets[].FileName] | length == (unique | length))
              and ([$assets[] | select(.FileName == $full)] | length == 1)
              and ([$assets[] | select(.FileName == $delta)] | length == 0)
            ' "$manifest_path" >/dev/null \
              || { echo "Velopack manifest '$manifest_name' has no release assets." >&2; exit 1; }
            while IFS=$'\t' read -r package_name expected_sha256; do
              case "$package_name" in
                "Sunder-$VERSION-app-$runtime-$RELEASE_CHANNEL-full.nupkg") ;;
                *) echo "Velopack manifest '$manifest_name' contains an unexpected package identity." >&2; exit 1 ;;
              esac
              [[ "$expected_sha256" =~ ^[0-9a-fA-F]{64}$ ]] \
                || { echo "Velopack manifest '$manifest_name' contains an invalid package digest." >&2; exit 1; }
              package_path="$output_dir/$package_name"
              test -f "$package_path" \
                || { echo "Velopack manifest '$manifest_name' references missing '$package_name'." >&2; exit 1; }
              if command -v sha256sum >/dev/null 2>&1; then
                actual_sha256="$(sha256sum "$package_path" | cut -d ' ' -f 1)"
              else
                actual_sha256="$(shasum -a 256 "$package_path" | cut -d ' ' -f 1)"
              fi
              [[ "${actual_sha256,,}" == "${expected_sha256,,}" ]] \
                || { echo "Velopack manifest digest mismatch for '$package_name'." >&2; exit 1; }
            done < <(jq -r '.Assets[] | [.FileName, .SHA256] | @tsv' "$manifest_path")
          done

          for dmg_asset in "${expected_dmg_assets[@]}"; do
            dmg_name="$(basename "$dmg_asset")"
            checksum_count="$(grep -Ec "^[0-9a-fA-F]{64}  ${dmg_name//./\\.}$" release-assets/SHA256SUMS || true)"
            if [[ "$checksum_count" != "1" ]]; then
              echo "SHA256SUMS must contain exactly one entry for '$dmg_name'." >&2
              exit 1
            fi
          done

          while IFS= read -r remote_asset_name; do
            case "$remote_asset_name" in
              *-Setup.pkg|*-Portable.zip)
                echo "Draft release contains alternate distribution asset '$remote_asset_name'." >&2
                exit 1
                ;;
            esac
          done < <(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/releases/$release_id" --jq '.assets[].name')

          bash scripts/release/verify-github-release-assets.sh \
            "$release_id" \
            "$tag" \
            release-assets \
            "${expected_remote_names[@]}"
          verified_release=true
          {
            echo "release_id=$release_id"
            echo "evidence_run_attempt=$evidence_run_attempt"
          } >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Capture exact verified publication bytes
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVIDENCE_RUN_ATTEMPT: ${{ steps.publication.outputs.evidence_run_attempt }}
          RELEASE_ID: ${{ steps.publication.outputs.release_id }}
        run: |
          set -euo pipefail
          artifact_name="sunder-app-publication-evidence-$RELEASE_ID-$EVIDENCE_RUN_ATTEMPT"
          mkdir publication-evidence
          bash scripts/release/download-github-release-assets.sh \
            "$RELEASE_ID" "app/v${{ needs.prepare.outputs.version }}" publication-evidence
          encoded_name="$(jq -rn --arg value "$artifact_name" '$value | @uri')"
          artifacts="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?name=$encoded_name")"
          artifact_count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "$artifacts")"
          [[ "$artifact_count" -le 1 ]] || { echo "Publication handoff artifact is ambiguous." >&2; exit 1; }
          {
            echo "artifact_name=$artifact_name"
            echo "upload=$([[ "$artifact_count" == 0 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable publication evidence
        if: steps.handoff.outputs.upload == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: publication-evidence/*
          if-no-files-found: error
          retention-days: 90
