name: Sunder App Packaging CI

on:
  pull_request:
    paths:
      - ".github/workflows/sunder-app-packaging-ci.yml"
      - ".github/workflows/sunder-app-release.yml"
      - ".github/workflows/sunder-cli-release.yml"
      - ".github/workflows/sunder-host-release.yml"
      - ".github/workflows/sunder-release-promotion.yml"
      - ".github/workflows/sunder-sdk-release.yml"
      - ".github/workflows/sunder-host-validation.yml"
      - "scripts/install/**"
      - "scripts/release/**"
      - "scripts/test/**"
      - "scripts/test-oracles/**"
      - "eng/test-oracles/**"
      - "languages/csharp/dotnet/Directory.Build.props"
      - "languages/csharp/dotnet/Directory.Packages.props"
      - "languages/csharp/dotnet/host/**"
      - "languages/csharp/dotnet/libraries/**"
      - "languages/csharp/dotnet/packages/**"
      - "languages/csharp/dotnet/tests/Directory.Build.props"
      - "languages/csharp/dotnet/tests/Sunder.App.Tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sunder-app-packaging-ci.yml"
      - ".github/workflows/sunder-app-release.yml"
      - ".github/workflows/sunder-cli-release.yml"
      - ".github/workflows/sunder-host-release.yml"
      - ".github/workflows/sunder-release-promotion.yml"
      - ".github/workflows/sunder-sdk-release.yml"
      - ".github/workflows/sunder-host-validation.yml"
      - "scripts/install/**"
      - "scripts/release/**"
      - "scripts/test/**"
      - "scripts/test-oracles/**"
      - "eng/test-oracles/**"
      - "languages/csharp/dotnet/Directory.Build.props"
      - "languages/csharp/dotnet/Directory.Packages.props"
      - "languages/csharp/dotnet/host/**"
      - "languages/csharp/dotnet/libraries/**"
      - "languages/csharp/dotnet/packages/**"
      - "languages/csharp/dotnet/tests/Directory.Build.props"
      - "languages/csharp/dotnet/tests/Sunder.App.Tests/**"

permissions:
  contents: read

concurrency:
  group: sunder-app-packaging-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.100"
  NODE_VERSION: "24.18.1"
  VELOPACK_VERSION: "0.0.1298"

jobs:
  bundled-app-validation:
    name: Bundled App output (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore App tests
        run: dotnet restore languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj --locked-mode

      - name: Require bundled App execution owner
        run: >-
          node scripts/test-oracles/run-core-test-lane.mjs
          --test Sunder.App.Tests.BundledBuildOutputTests.AppBuildContainsSupervisorRuntimeAndCliExecutables

      - name: Validate bundled executables
        run: >-
          dotnet test languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj
          --configuration Release
          --no-restore
          -m:1
          --filter "FullyQualifiedName~BundledBuildOutputTests"
          --logger "trx;LogFileName=Sunder.App.Tests.trx"
          --results-directory artifacts/test-results/app-packaging-${{ runner.os }}

      - name: Summarize bundled App results
        if: always()
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results/app-packaging-${{ runner.os }}
          --allow-partial
          --require-test Sunder.App.Tests.BundledBuildOutputTests.AppBuildContainsSupervisorRuntimeAndCliExecutables

      - name: Upload bundled App results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-app-packaging-results-${{ runner.os }}
          path: artifacts/test-results/app-packaging-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14

  release-script-validation:
    name: Release script and evidence validation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}
            9.0.100

      - name: Smoke unsigned Linux RID release packaging under CI locked defaults
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools
          tool_dir="$RUNNER_TEMP/velopack"
          tool_sdk_dir="$RUNNER_TEMP/velopack-sdk"
          output_root="$RUNNER_TEMP/sunder-linux-release-smoke"
          dotnet new globaljson \
            --sdk-version 9.0.100 \
            --roll-forward disable \
            --output "$tool_sdk_dir"
          (
            cd "$tool_sdk_dir"
            test "$(dotnet --version)" = "9.0.100"
            dotnet tool install --tool-path "$tool_dir" vpk --version "$VELOPACK_VERSION"
          )
          CI=true PATH="$tool_dir:$PATH" \
            bash scripts/release/package-sunder.sh \
              --version 1.0.0-smoke.1 \
              --runtime linux-x64 \
              --output-root "$output_root" \
              --strict-release
          git diff --exit-code -- ':(glob)languages/csharp/dotnet/**/packages.lock.json'
          release_dir="$output_root/velopack/stable/linux-x64"
          test -f "$release_dir/Sunder-app-linux-x64-stable.AppImage"
          test -f "$release_dir/Sunder-1.0.0-smoke.1-app-linux-x64-stable-full.nupkg"

      - name: Validate Bash scripts and release evidence fixture
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install/install.sh
          bash -n scripts/release/package-sunder.sh
          bash -n scripts/release/download-github-release-assets.sh
          bash -n scripts/release/generate-release-evidence.sh
          bash -n scripts/release/preflight-npm-trusted-publishing.sh
          bash -n scripts/release/resolve-github-release.sh
          bash -n scripts/test/release/resolve-github-release.fixture.sh
          bash -n scripts/release/upload-github-release-assets.sh
          bash -n scripts/test/release/upload-github-release-assets.fixture.sh
          bash -n scripts/release/upload-production-acceptance.sh
          bash -n scripts/test/release/upload-production-acceptance.fixture.sh
          bash -n scripts/release/verify-github-release-assets.sh
          bash -n scripts/test/release/verify-github-release-assets.fixture.sh
          bash -n scripts/release/verify-nuget-package.sh
          bash -n scripts/release/verify-nuget-source.sh
          bash -n scripts/release/verify-production-acceptance.sh
          bash -n scripts/test/release/verify-production-acceptance.fixture.sh
          bash -n scripts/release/verify-release-tag.sh
          bash -n scripts/test/release/verify-release-tag.fixture.sh
          bash -n scripts/release/verify-release-promotion.sh
          bash -n scripts/test/release/verify-release-promotion.fixture.sh
          bash -n scripts/release/macos/create-sunder-dmg.sh

          fixture="$RUNNER_TEMP/release-evidence-fixture"
          mkdir -p "$fixture"
          printf 'CLI release fixture\n' > "$fixture/sunder-cli-1.2.3-linux-x64.tar.gz"
          printf 'Host release fixture\n' > "$fixture/sunder-runtime-host-1.2.3-linux-x64.tar.gz"
          source_sha="0123456789012345678901234567890123456789"
          bash scripts/release/generate-release-evidence.sh "$fixture" "sunder-core=$source_sha"

          jq -e --arg source_sha "$source_sha" '
            .schemaVersion == 1
            and .sources == [{name: "sunder-core", sha: $source_sha}]
            and .invocation.repository == env.GITHUB_REPOSITORY
            and .invocation.workflow == env.GITHUB_WORKFLOW
            and .invocation.workflowRef == env.GITHUB_WORKFLOW_REF
            and .invocation.runId == env.GITHUB_RUN_ID
            and .invocation.runAttempt == env.GITHUB_RUN_ATTEMPT
            and .invocation.ref == env.GITHUB_REF
            and .invocation.refName == env.GITHUB_REF_NAME
            and .invocation.sha == env.GITHUB_SHA
            and (.artifacts | length == 2)
            and all(.artifacts[]; .path | test("^[A-Za-z0-9][A-Za-z0-9._+-]*$"))
            and all(.artifacts[]; .sha256 | test("^[0-9a-f]{64}$"))
          ' "$fixture/release-provenance.json" >/dev/null
          jq -e '.spdxVersion == "SPDX-2.3" and (.files | length == 2)' \
            "$fixture/release-sbom.spdx.json" >/dev/null
          test "$(grep -Ec '^[0-9a-f]{64}  sunder-cli-1\.2\.3-linux-x64\.tar\.gz$' "$fixture/SHA256SUMS")" -eq 1
          test "$(grep -Ec '^[0-9a-f]{64}  sunder-runtime-host-1\.2\.3-linux-x64\.tar\.gz$' "$fixture/SHA256SUMS")" -eq 1
          if bash scripts/release/generate-release-evidence.sh "$fixture" "sunder-core=not-a-sha"; then
            echo "Release evidence accepted an invalid source SHA." >&2
            exit 1
          fi

      - name: Run release publication and promotion regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test/release/resolve-github-release.fixture.sh
          bash scripts/test/release/upload-github-release-assets.fixture.sh
          bash scripts/test/release/upload-production-acceptance.fixture.sh
          bash scripts/test/release/verify-github-release-assets.fixture.sh
          bash scripts/test/release/verify-release-tag.fixture.sh
          bash scripts/test/release/verify-release-promotion.fixture.sh
          bash scripts/test/release/verify-production-acceptance.fixture.sh

      - name: Run release workflow policy tests
        run: node --test scripts/test/release/*.test.mjs

  powershell-script-validation:
    name: PowerShell release script syntax
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "scripts/install/install.ps1",
            "scripts/release/package-sunder.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $details = ($errors | ForEach-Object { $_.Message }) -join "; "
              throw "PowerShell parser errors in '$file': $details"
            }
          }

  dmg-layout-smoke:
    name: Branded DMG layout smoke
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/release/package-sunder.sh
          bash -n scripts/release/generate-release-evidence.sh
          bash -n scripts/release/macos/create-sunder-dmg.sh
          bash -n scripts/install/install.sh
          swiftc -typecheck scripts/release/macos/render-sunder-dmg-background.swift

      - name: Create unsigned fixture app
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/sunder-dmg-fixture/Sunder.app"
          mkdir -p "$fixture/Contents/MacOS"
          cat > "$fixture/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Sunder</string>
            <key>CFBundleIdentifier</key>
            <string>com.younics.sunder.fixture</string>
            <key>CFBundleName</key>
            <string>Sunder</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
          </dict>
          </plist>
          PLIST
          printf '#!/usr/bin/env bash\nexit 0\n' > "$fixture/Contents/MacOS/Sunder"
          chmod +x "$fixture/Contents/MacOS/Sunder"
          echo "app=$fixture" >> "$GITHUB_OUTPUT"

      - name: Create and inspect branded DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/Sunder.dmg"
          mount_dir="$RUNNER_TEMP/sunder-dmg-mount"
          mounted="false"
          cleanup() {
            if [[ "$mounted" == "true" ]]; then
              hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          scripts/release/macos/create-sunder-dmg.sh \
            --app "${{ steps.fixture.outputs.app }}" \
            --output "$dmg"
          hdiutil verify "$dmg" >/dev/null
          mkdir -p "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg" >/dev/null
          mounted="true"

          test -d "$mount_dir/Sunder.app"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          test -s "$mount_dir/.background/Sunder.tiff"
          test -s "$mount_dir/.DS_Store"
          visible_entries=("$mount_dir"/*)
          test "${#visible_entries[@]}" -eq 2
          hidden_entries=("$mount_dir"/.[!.]*)
          test "${#hidden_entries[@]}" -eq 2
          tiff_info="$(tiffutil -info "$mount_dir/.background/Sunder.tiff")"
          grep -q 'Image Width: 820 Image Length: 460' <<< "$tiff_info"
          grep -q 'Image Width: 1640 Image Length: 920' <<< "$tiff_info"

      - name: Upload DMG smoke artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-themed-dmg-smoke
          path: ${{ runner.temp }}/Sunder.dmg
          if-no-files-found: error
          retention-days: 3
