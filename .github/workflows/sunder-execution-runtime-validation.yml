name: Sunder Official Runtime Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sunder-execution-runtime-validation.yml"
      - ".github/workflows/sunder-production-acceptance.yml"
      - "docs/OFFICIAL-RUNTIME-HANDOFF.md"
      - "scripts/release/official_runtime_evidence.py"
      - "scripts/release/verify-production-acceptance.sh"
      - "scripts/test/release/**"
      - "languages/csharp/dotnet/host/Sunder.Runtime.Host/**"
      - "languages/csharp/dotnet/host/Sunder.Runtime.Contracts/**"
      - "languages/csharp/dotnet/host/Sunder.Runtime.Client/**"
      - "languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/**"
      - "languages/csharp/dotnet/tests/Sunder.Runtime.Client.Tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sunder-execution-runtime-validation.yml"
      - ".github/workflows/sunder-production-acceptance.yml"
      - "docs/OFFICIAL-RUNTIME-HANDOFF.md"
      - "scripts/release/official_runtime_evidence.py"
      - "scripts/release/verify-production-acceptance.sh"
      - "scripts/test/release/**"
      - "languages/csharp/dotnet/host/Sunder.Runtime.Host/**"
      - "languages/csharp/dotnet/host/Sunder.Runtime.Contracts/**"
      - "languages/csharp/dotnet/host/Sunder.Runtime.Client/**"
      - "languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/**"
      - "languages/csharp/dotnet/tests/Sunder.Runtime.Client.Tests/**"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.100"

jobs:
  host-tests:
    name: Host official installer and launcher owning tests (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-14
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET test SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Run the complete owning projects, not a guessed/empty official-test filter.
      # Host owner must supply the implemented exact official native cases before
      # these results are described as vendor download/native launch qualification.
      - name: Restore Host and client owning tests
        shell: bash
        run: |
          dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode
          dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Client.Tests/Sunder.Runtime.Client.Tests.csproj --locked-mode

      - name: Run Host installer, store, binding and launcher tests
        run: >-
          dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj
          -c Release --no-restore -p:GeneratePackageOnBuild=false
          --logger trx --results-directory artifacts/official-host-tests

      - name: Run current official management protocol client tests
        run: >-
          dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Client.Tests/Sunder.Runtime.Client.Tests.csproj
          -c Release --no-restore -p:GeneratePackageOnBuild=false
          --logger trx --results-directory artifacts/official-client-tests

      - name: Retain owning test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-runtime-tests-${{ matrix.rid }}
          path: artifacts/official-*-tests/*.trx
          if-no-files-found: error
          retention-days: 30

  release-contracts:
    name: Mocked source, acceptance and package/catalog release contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release hooks and retained handoffs
        run: node --test scripts/test/release/verify-release-promotion-workflows.test.mjs
      - name: Validate Host evidence shape and source/catalog handoffs
        run: python3 -B -m unittest discover -s scripts/test/release -p 'test_*evidence.py' -v
      - name: Validate source/catalog approval and immutable asset identity
        run: python3 -B -m unittest discover -s scripts/test/release -p test_release_handoffs.py -v
      - name: Validate production acceptance with mocked Host records
        run: bash scripts/test/release/verify-production-acceptance.fixture.sh
