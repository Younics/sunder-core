name: Sunder Node CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sunder-node-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.100"
  NODE_VERSION: "24.18.1"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  typescript:
    name: TypeScript SDK, tooling, and templates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      npm_version: ${{ steps.sdk-metadata.outputs.npm_version }}
      npm_version_range: ${{ steps.sdk-metadata.outputs.npm_version_range }}
      sdk_version: ${{ steps.sdk-metadata.outputs.version }}
      vite_version: ${{ steps.sdk-metadata.outputs.vite_version }}
    defaults:
      run:
        working-directory: languages/typescript/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json
      - name: Verify coordinated SDK and Node metadata
        id: sdk-metadata
        run: node ../../../scripts/release/check-sdk-version.mjs
      - name: Install exact packageManager npm
        env:
          NPM_VERSION: ${{ steps.sdk-metadata.outputs.npm_version }}
        run: |
          npm install --global "npm@$NPM_VERSION" --registry=https://registry.npmjs.org
          node -e "const actual = require('node:child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (actual !== process.env.NPM_VERSION) throw new Error('Expected npm ' + process.env.NPM_VERSION + ', found ' + actual);"
      - run: npm ci
      - run: npm ls --all
      - name: Require Node execution lane
        run: node ../../../scripts/test-oracles/run-core-test-lane.mjs --primary-lane node
      - name: Test Node SDK, tooling, templates, and Core scripts with JUnit
        run: node ../../../scripts/test-oracles/run-node-test-matrix-with-results.mjs
      - name: Summarize Node results
        if: always()
        run: >-
          node ../../../scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results
          --allow-partial
          --require-primary-lane node
      - name: Upload Node results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Pack and verify exact npm artifacts
        env:
          NPM_VERSION_RANGE: ${{ steps.sdk-metadata.outputs.npm_version_range }}
          SDK_VERSION: ${{ steps.sdk-metadata.outputs.version }}
          VITE_VERSION: ${{ steps.sdk-metadata.outputs.vite_version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sunder-node-packages"
          mkdir -p "$output"
          npm pack --json \
            --pack-destination "$output" \
            --workspace @sunder/sdk \
            --workspace @sunder/package-tool \
            --workspace create-sunder-package \
            > "$RUNNER_TEMP/npm-pack.json"
          node ../../../scripts/release/verify-node-package-artifacts.mjs \
            "$SDK_VERSION" "$NPM_VERSION_RANGE" "$VITE_VERSION" "$output" "$RUNNER_TEMP/npm-pack.json"
      - name: Upload exact npm artifacts for generated-template acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-local-v1-feed
          path: ${{ runner.temp }}/sunder-node-packages/*.tgz
          if-no-files-found: error
          retention-days: 14

  template-lifecycle:
    name: Generated ${{ matrix.preset }} template lifecycle
    needs: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: node
            package_id: sunder.template.node
            artifact: node
          - preset: react-node
            package_id: sunder.template.react
            artifact: react-node
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact packageManager npm
        run: |
          npm install --global "npm@${{ needs.typescript.outputs.npm_version }}" --registry=https://registry.npmjs.org
          node -e "const actual = require('node:child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (actual !== '${{ needs.typescript.outputs.npm_version }}') throw new Error('Unexpected npm version ' + actual);"
      - name: Download local V1 npm artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-node-local-v1-feed
          path: local-node-feed
      - name: Generate, install, test, develop, build, and package
        shell: bash
        env:
          PACKAGE_ID: ${{ matrix.package_id }}
          PRESET: ${{ matrix.preset }}
          SDK_VERSION: ${{ needs.typescript.outputs.sdk_version }}
        run: |
          set -euo pipefail
          feed="$GITHUB_WORKSPACE/local-node-feed"
          sdk="$feed/sunder-sdk-$SDK_VERSION.tgz"
          tool="$feed/sunder-package-tool-$SDK_VERSION.tgz"
          creator="$feed/create-sunder-package-$SDK_VERSION.tgz"
          bootstrap="$RUNNER_TEMP/sunder-template-bootstrap-$PRESET"
          sample="$RUNNER_TEMP/sunder-template-$PRESET"
          test -f "$sdk"
          test -f "$tool"
          test -f "$creator"
          npm install --prefix "$bootstrap" --no-audit --no-fund "$sdk" "$creator"
          "$bootstrap/node_modules/.bin/create-sunder-package" \
            --preset "$PRESET" \
            --package-id "$PACKAGE_ID" \
            --package-name "Sunder $PRESET template smoke" \
            --output "$sample"
          npm install --prefix "$sample" --no-audit --no-fund "$sdk" "$tool"
          npm --prefix "$sample" run contracts:accept
          npm --prefix "$sample" run contracts:check
          npm --prefix "$sample" run typecheck
          npm --prefix "$sample" test
          npm --prefix "$sample" run sunder:dev:once
          npm --prefix "$sample" run build
          npm --prefix "$sample" run contracts:freeze
          npm --prefix "$sample" run package
          test -f "$sample/dist/sunder-dev/manifest/sunder-package.json"
          test -f "$sample/dist/$PACKAGE_ID.1.0.0.sunderpkg"
          test -f "$sample/dist/$PACKAGE_ID.1.0.0.package-evidence.json"
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            test -d "$sample/dist/targets/$rid"
            if [[ "$PRESET" == "react-node" ]]; then
              test -d "$sample/dist/targets/app-$rid"
            fi
          done
      - name: Upload generated template lifecycle output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-template-${{ matrix.artifact }}-output
          path: ${{ runner.temp }}/sunder-template-${{ matrix.preset }}/dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated Node development package for Host smoke
        if: ${{ matrix.preset == 'node' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-template-dev-package
          path: ${{ runner.temp }}/sunder-template-node/dist/sunder-dev
          if-no-files-found: error
          retention-days: 14

  output-lock-interop:
    name: Required Node and .NET output-lock interop
    needs: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: languages/typescript/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build the exact Node test helper
        run: |
          set -euo pipefail
          npm install --global "npm@${{ needs.typescript.outputs.npm_version }}" --registry=https://registry.npmjs.org
          [[ "$(npm --version)" == "${{ needs.typescript.outputs.npm_version }}" ]]
          npm ci
          ./node_modules/.bin/tsc -p packages/package-tool/tsconfig.test.json
          test -f packages/package-tool/dist-test/test/output-child.js
      - name: Require cross-language output-lock behavior
        env:
          SUNDER_REQUIRE_NODE_OUTPUT_LOCK_INTEROP: "1"
        run: |
          dotnet restore ../../csharp/dotnet/tests/Sunder.Package.Build.Tests/Sunder.Package.Build.Tests.csproj --locked-mode
          dotnet test ../../csharp/dotnet/tests/Sunder.Package.Build.Tests/Sunder.Package.Build.Tests.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            --filter FullyQualifiedName~SharedOutputLock_InteroperatesWithNodeProducerWhenAvailable \
            --logger "trx;LogFileName=Sunder.Package.Build.Tests.trx" \
            --results-directory ../../../artifacts/test-results/node-output-lock
      - name: Summarize required output-lock result
        if: always()
        run: >-
          node ../../../scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results/node-output-lock
          --allow-partial
          --require-test Sunder.Package.Build.Tests.PackageBuildManifestTests.SharedOutputLock_InteroperatesWithNodeProducerWhenAvailable
      - name: Upload required output-lock result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-output-lock-results
          path: artifacts/test-results/node-output-lock
          if-no-files-found: warn
          retention-days: 14

  module-package:
    name: Six-RID runtime-backed module package
    needs: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: languages/typescript/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/node/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install exact packageManager npm
        run: |
          npm install --global "npm@${{ needs.typescript.outputs.npm_version }}" --registry=https://registry.npmjs.org
          node -e "const actual = require('node:child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (actual !== '${{ needs.typescript.outputs.npm_version }}') throw new Error('Unexpected npm version ' + actual);"
      - run: npm ci
      - run: npm ls --all
      - run: npm run build
      - name: Build and aggregate deterministic universal package
        shell: bash
        run: |
          set -euo pipefail
          npm run module:package
          package="$PWD/fixtures/runtime-backed-worker/dist/sunder.node.runtimebacked.1.0.0.sunderpkg"
          test -f "$package"
          unzip -t "$package"
      - name: Build package validation CLI
        run: |
          dotnet restore ../../csharp/dotnet/host/Sunder.Cli/Sunder.Cli.csproj --locked-mode
          dotnet build ../../csharp/dotnet/host/Sunder.Cli/Sunder.Cli.csproj --configuration Release --no-restore -p:GeneratePackageOnBuild=false
      - name: Validate universal package with the .NET inspector
        run: >-
          dotnet ../../csharp/dotnet/host/Sunder.Cli/bin/Release/net10.0/sunder.dll
          dev package validate
          "$PWD/fixtures/runtime-backed-worker/dist/sunder.node.runtimebacked.1.0.0.sunderpkg"
      - name: Upload exact-RID module leaves
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-module-leaves
          path: languages/typescript/node/fixtures/runtime-backed-worker/dist/targets
          if-no-files-found: error
          retention-days: 14
      - name: Upload universal runtime-backed package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-runtime-backed-package
          path: languages/typescript/node/fixtures/runtime-backed-worker/dist/sunder.node.runtimebacked.1.0.0.sunderpkg
          if-no-files-found: error
          retention-days: 14
      - name: Upload deterministic package ownership evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-package-ownership-evidence
          path: languages/typescript/node/fixtures/runtime-backed-worker/dist/sunder.node.runtimebacked.1.0.0.package-evidence.json
          if-no-files-found: error
          retention-days: 14

  runtime-host-handoff:
    name: Required package and official Runtime Host handoff
    needs:
      - module-package
      - template-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUNDER_REQUIRE_NODE_MODULE_PACKAGE: "1"
      SUNDER_NODE_MODULE_PACKAGE_PATH: ${{ github.workspace }}/artifacts/node/package/sunder.node.runtimebacked.1.0.0.sunderpkg
      SUNDER_NODE_MODULE_EXPECTED_RIDS: win-x64,win-arm64,linux-x64,linux-arm64,osx-x64,osx-arm64
      SUNDER_REQUIRE_NODE_MODULE_INTEROP: "1"
      SUNDER_NODE_MODULE_LEAF_PATH: ${{ github.workspace }}/artifacts/node/leaves/linux-x64
      SUNDER_REQUIRE_NODE_TEMPLATE_HOST_SMOKE: "1"
      SUNDER_NODE_TEMPLATE_DEV_PATH: ${{ github.workspace }}/artifacts/node/template-dev
      SUNDER_REQUIRE_NODE24_HOST_INTEGRATION: "1"
      SUNDER_WORKER_RELEASE_METRICS_PATH: ${{ github.workspace }}/artifacts/worker-release-metrics/node-module.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Download universal Node package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-node-runtime-backed-package
          path: artifacts/node/package
      - name: Download exact-RID Node leaves
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-node-module-leaves
          path: artifacts/node/leaves
      - name: Download generated Node development package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-node-template-dev-package
          path: artifacts/node/template-dev
      - name: Require downloaded package inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SUNDER_NODE_MODULE_PACKAGE_PATH"
          test -f "$SUNDER_NODE_MODULE_LEAF_PATH/manifest/sunder-package.json"
          test -f "$SUNDER_NODE_TEMPLATE_DEV_PATH/manifest/sunder-package.json"
          [[ "$(node --version)" == "v${NODE_VERSION}" ]]
      - name: Restore package and Runtime Host acceptance tests
        run: |
          dotnet restore languages/csharp/dotnet/tests/Sunder.Package.Format.Tests/Sunder.Package.Format.Tests.csproj --locked-mode
          dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode
      - name: Require .NET package-format handoff
        run: >-
          dotnet test languages/csharp/dotnet/tests/Sunder.Package.Format.Tests/Sunder.Package.Format.Tests.csproj
          --configuration Release
          --no-restore
          -m:1
          --filter FullyQualifiedName=Sunder.Package.Format.Tests.NodePackageArchiveCompatibilityTests.NodePackageArchive_WhenConfigured_IsAcceptedByDotNetInspector
          --logger "trx;LogFileName=Sunder.Package.Format.Tests.trx"
          --results-directory artifacts/test-results/node-runtime-host
      - name: Require official Runtime Host interop and generated-template smoke
        run: >-
          dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj
          --configuration Release
          --no-restore
          -m:1
          -p:GeneratePackageOnBuild=false
          --filter "FullyQualifiedName~Sunder.Runtime.Host.Tests.CrossLanguageWorkerRuntimeHostTests|FullyQualifiedName=Sunder.Runtime.Host.Tests.GeneratedTemplateRuntimeHostSmokeTests.GeneratedNodeTemplate_ActivatesThroughOfficialRuntimeHost"
          --logger "trx;LogFileName=Sunder.Runtime.Host.Tests.trx"
          --results-directory artifacts/test-results/node-runtime-host
      - name: Summarize required package and Runtime Host results
        if: always()
        run: >-
          node scripts/test-oracles/summarize-core-test-results.mjs
          artifacts/test-results/node-runtime-host
          --allow-partial
          --require-test Sunder.Package.Format.Tests.NodePackageArchiveCompatibilityTests.NodePackageArchive_WhenConfigured_IsAcceptedByDotNetInspector
          --require-test Sunder.Runtime.Host.Tests.CrossLanguageWorkerRuntimeHostTests.DotNetToNode_RealRuntimeHostRunsRuntimeBackedModuleUnaryStreamDataFaultAndShutdown
          --require-test Sunder.Runtime.Host.Tests.CrossLanguageWorkerRuntimeHostTests.NodeToDotNet_RealRuntimeHostRoutesRpcToNativeDotNetWorker
          --require-test Sunder.Runtime.Host.Tests.GeneratedTemplateRuntimeHostSmokeTests.GeneratedNodeTemplate_ActivatesThroughOfficialRuntimeHost
      - name: Upload required Runtime Host results and metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-node-runtime-host-results
          path: |
            artifacts/test-results/node-runtime-host
            artifacts/worker-release-metrics/node-module.json
          if-no-files-found: warn
          retention-days: 14
