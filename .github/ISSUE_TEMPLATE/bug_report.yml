name: Bug report
description: Report a reproducible problem in Sunder Core
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include secrets, tokens, credentials, or private package artifacts.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest steps that reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: app/v0.1.0, sdk/v0.1.0, or commit SHA
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Runtime host
        - CLI
        - SDK
        - Package build tooling
        - Package templates
        - Package management/archive validation
        - Registry contracts
        - Documentation
        - Other
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs with secrets removed.
      render: text
